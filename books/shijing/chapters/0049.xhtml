<h2>鶉之奔奔</h2>
<h3>國風‧鄘‧鶉之奔奔</h3>
<p>毛詩序：「《鶉之奔奔》，刺衞宣姜也。衞人以為宣姜鶉鵲之不若也。」</p>
<h3>鶉之奔奔</h3>
<p>鶉之奔奔，鵲之彊彊，人之無良，我以為兄。</p>
<p>鵲之彊彊，鶉之奔奔，人之無良，我以為君。</p>
<p>《鶉之奔奔》，二章，章四句。</p>
