<h2>菀柳</h2>
<h3>小雅‧魚藻之什‧菀柳</h3>
<p>毛詩序：「《菀柳》，刺幽王也。暴虐無親而刑罰不中，諸侯皆不欲朝，言王者之不可朝事也。」</p>
<h3>菀柳</h3>
<p>有菀者柳，不尚息焉？上帝甚蹈，無自暱焉。俾予靖之，後予極焉。</p>
<p>有菀者柳，不尚愒焉？上帝甚蹈，無自瘵焉。俾予靖之，後予邁焉。</p>
<p>有鳥高飛，亦傅于天。彼人之心，于何其臻？曷予靖之？居以凶矜。</p>
<p>《菀柳》，三章，章六句。</p>
