<h2>漢廣</h2>
<h3>韓詩敘</h3>
<p>漢廣，說人也。</p>
<h3>毛詩序</h3>
<p>《漢廣》，德廣所及也。文王之道被于南國，美化行乎江漢之域，無思犯禮，求而不可得也。</p>
<h3>詩文</h3>
<p>南有喬木，不可休息；漢有游女，不可求思，漢之廣矣，不可泳思，江之永矣，不可方思。<br/>翹翹錯薪，言刈其楚，之子于歸，言秣其馬，漢之廣矣，不可泳思，江之永矣，不可方思。<br/>翹翹錯薪，言刈其蔞，之子于歸，言秣其駒，漢之廣矣，不可泳思，江之永矣，不可方思。</p>
<p>《漢廣》，三章，章八句。</p>
