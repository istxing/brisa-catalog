<h2>溱洧</h2>
<h3>國風‧鄭‧溱洧</h3>
<p>毛詩序：「《溱洧》，刺亂也。兵革不息，男女相棄，淫風大行，莫之能救焉。」</p>
<h3>溱洧</h3>
<p>溱與洧，方渙渙兮。士與女，方秉蕑兮。女曰觀乎，士曰既且。且往觀乎，洧之外，洵訐且樂。維士與女，伊其相謔。贈之以勺藥。</p>
<p>溱與洧，瀏其清矣。士與女，殷其盈矣。女曰觀乎，士曰既且。且往觀乎，洧之外，洵訐且樂。維士與女，伊其將謔。贈之以勺藥。</p>
<p>《溱洧》，二章，章十二句。</p>
