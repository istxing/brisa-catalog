<h2>泂酌</h2>
<h3>大雅‧生民之什‧泂酌</h3>
<p>毛詩序：「《泂酌》，召康公戒成王也。言皇天親有德，饗有道也。」</p>
<h3>泂酌</h3>
<p>泂酌彼行潦，挹彼注茲，可以餴饎。豈弟君子，民之父母。</p>
<p>泂酌彼行潦，挹彼注茲，可以濯罍。豈弟君子，民之攸歸。</p>
<p>泂酌彼行潦，挹彼注茲，可以濯溉。豈弟君子，民之攸塈。</p>
<p>《泂酌》，三章，章五句。</p>
