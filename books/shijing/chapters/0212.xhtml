<h2>無將大車</h2>
<h3>小雅‧谷風之什‧無將大車</h3>
<p>毛詩序：「《無將大車》，大夫悔將小人也。」</p>
<h3>無將大車</h3>
<p>無將大車，祇自塵兮。無思百憂，祇自疷兮。</p>
<p>無將大車，維塵冥冥。無思百憂，不出于熲。</p>
<p>無將大車，維塵雍兮。無思百憂，祇自重兮。</p>
<p>《無將大車》，三章，章四句。</p>
