<h2>卷二十一</h2>
<p>制詔御史：「諸侯王或欲推私恩分子弟邑者，令各條上，朕且臨定其號名。」</p>
<p>太史公曰：盛哉，天子之德！一人有慶，天下賴之。</p>
<h3>索隱述贊</h3>
<p>漢世之初，矯枉過正。欲大本枝，先封同姓。建元已後，籓翰克盛。主父上言，推恩下令。長沙濟北，中山趙敬。分邑廣封。振振在詠。扞城禦侮，曄曄輝映。百足不僵，一人有慶。</p>
