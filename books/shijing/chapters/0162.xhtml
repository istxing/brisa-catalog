<h2>四牡</h2>
<h3>小雅‧鹿鳴之什‧四牡</h3>
<p>毛詩序：「《四牡》，勞使臣之來也。有功而見知則說矣。」</p>
<h3>四牡</h3>
<p>四牡騑騑，周道倭遲。豈不懷歸？王事靡盬，我心傷悲。</p>
<p>四牡騑騑，嘽嘽駱馬。豈不懷歸？王事靡盬，不遑啟處。</p>
<p>翩翩者鵻，載飛載下，集于苞栩。王事靡盬，不遑將父。</p>
<p>翩翩者鵻，載飛載止，集于苞杞。王事靡盬，不遑將母。</p>
<p>駕彼四駱，載驟駸駸。豈不懷歸？是用作歌，將母來諗。</p>
<p>《四牡》，五章，章五句。</p>
