<h2>臣工</h2>
<h3>周頌‧臣工之什‧臣工</h3>
<p>毛詩序：「《臣工》，諸侯助祭，遣於廟也。」</p>
<h3>臣工</h3>
<p>嗟嗟臣工，敬爾在公。王釐爾成，來咨來茹。</p>
<p>嗟嗟保介，維莫之春，亦又何求？如何新畬？</p>
<p>於皇來牟，將受厥明。明昭上帝，迄用康年。</p>
<p>命我衆人，庤乃錢鎛。奄觀銍艾。</p>
<p>《臣工》，一章，十五句。</p>
