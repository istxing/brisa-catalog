<h2>甫田</h2>
<h3>小雅‧甫田之什‧甫田</h3>
<p>毛詩序：「《甫田》，刺幽王也。君子傷今而思古焉。」</p>
<h3>甫田</h3>
<p>倬彼甫田，歲取十千。我取其陳，食我農人，自古有年。</p>
<p>今適南畝，或耘或耔。黍稷薿薿。攸介攸止，烝我髦士。</p>
<p>以我齊明，與我犧羊，以社以方。</p>
<p>我田既臧，農夫之慶。琴瑟擊鼓，以御田祖。</p>
<p>以祈甘雨，以介我稷黍，以穀我士女。</p>
<p>曾孫來止，以其婦子，饁彼南畝。</p>
<p>田畯至喜，攘其左右，嘗其旨否。</p>
<p>禾易長畝，終善且有。曾孫不怒，農夫克敏。</p>
<p>曾孫之稼，如茨如梁，曾孫之庾，如坻如京。</p>
<p>乃求千斯倉，乃求萬斯箱，黍稷稻粱。</p>
<p>農夫之慶，報以介福，萬壽無疆。</p>
<p>《甫田》，四章，章十句。</p>
