<h2>維天之命</h2>
<h3>周頌‧清廟之什‧維天之命</h3>
<p>毛詩序：「《維天之命》，大平告文王也。」</p>
<h3>維天之命</h3>
<p>維天之命，於穆不已。</p>
<p>於乎不顯，文王之德之純。</p>
<p>假以溢我，我其收之。</p>
<p>駿惠我文王，曾孫篤之。</p>
<p>《維天之命》，一章，八句。</p>
