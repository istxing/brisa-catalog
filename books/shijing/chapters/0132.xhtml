<h2>晨風</h2>
<h3>國風‧秦‧晨風</h3>
<p>毛詩序：「《晨風》，刺康公也。忘穆公之業，始棄其賢臣焉。」</p>
<h3>晨風</h3>
<p>鴥彼晨風，鬱彼北林，未見君子，憂心欽欽，如何如何，忘我實多。</p>
<p>山有苞櫟，隰有六駮，未見君子，憂心靡樂，如何如何，忘我實多。</p>
<p>山有苞棣，隰有樹檖，未見君子，憂心如醉，如何如何，忘我實多。</p>
<p>《晨風》，三章，章六句。</p>
