<h2>絲衣</h2>
<h3>周頌‧閔予小子之什‧絲衣</h3>
<p>毛詩序：「《絲衣》，繹賓尸也。高子曰：『靈星之尸也。』」</p>
<h3>絲衣</h3>
<p>絲衣其紑，載弁俅俅。自堂徂基，自羊徂牛。</p>
<p>鼐鼎及鼒，兕觥其觩。旨酒思柔。不吳不敖，胡考之休。</p>
<p>《絲衣》，一章，九句。</p>
