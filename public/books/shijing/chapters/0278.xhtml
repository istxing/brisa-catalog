<h2>我將</h2>
<h3>周頌‧清廟之什‧我將</h3>
<p>毛詩序：「《我將》，祀文王於明堂也。」</p>
<h3>我將</h3>
<p>我將我享，維羊維牛，維天其右之。</p>
<p>儀式刑文王之典，日靖四方。</p>
<p>伊嘏文王，既右饗之。</p>
<p>我其夙夜，畏天之威，于時保之。</p>
<p>《我將》，一章，十句。</p>
