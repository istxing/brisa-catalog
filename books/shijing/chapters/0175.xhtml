<h2>南山有臺</h2>
<h3>小雅‧南有嘉魚之什‧南山有臺</h3>
<p>毛詩序：「《南山有臺》，樂得賢也。得賢則能為邦家立太平之基矣。」</p>
<h3>南山有臺</h3>
<p>南山有臺，北山有萊。樂只君子，邦家之基。樂只君子，萬壽無期。</p>
<p>南山有桑，北山有楊。樂只君子，邦家之光。樂只君子，萬壽無疆。</p>
<p>南山有杞，北山有李。樂只君子，民之父母。樂只君子，德音不已。</p>
<p>南山有栲，北山有杻。樂只君子，遐不眉壽。樂只君子，德音是茂。</p>
<p>南山有枸，北山有楰。樂只君子，遐不黃耇。樂只君子，保艾爾後。</p>
<p>《南山有臺》，五章，章六句。</p>
