<h2>干旄</h2>
<h3>國風‧鄘‧干旄</h3>
<p>毛詩序：「《干旄》，美好善也。衞文公臣子多好善賢者，樂告以善道也。」</p>
<h3>干旄</h3>
<p>孑孑干旄，在浚之郊，素絲紕之，良馬四之，彼姝者子，何以畀之。</p>
<p>孑孑干旟，在浚之都，素絲組之，良馬五之，彼姝者子，何以予之。</p>
<p>孑孑干旌，在浚之城，素絲祝之，良馬六之，彼姝者子，何以告之。</p>
<p>《干旄》，三章，章六句。</p>
