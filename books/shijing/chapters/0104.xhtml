<h2>敝笱</h2>
<h3>國風‧齊‧敝笱</h3>
<p>毛詩序：「《敝笱》，刺文姜也。齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，為二國患焉。」</p>
<h3>敝笱</h3>
<p>敝笱在梁，其魚魴鰥。齊子歸止，其從如雲。</p>
<p>敝笱在梁，其魚魴鱮。齊子歸止，其從如雨。</p>
<p>敝笱在梁，其魚唯唯。齊子歸止，其從如水。</p>
<p>《敝笱》，三章，章四句。</p>
