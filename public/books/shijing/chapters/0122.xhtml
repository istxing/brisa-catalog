<h2>無衣</h2>
<h3>國風‧唐‧無衣</h3>
<p>毛詩序：「《無衣》，美晉武公也。武公始并晉國，其大夫為之請命乎天子之使，而作是詩也。」</p>
<h3>無衣</h3>
<p>豈曰無衣七兮、不如子之衣、安且吉兮。</p>
<p>豈曰無衣六兮、不如子之衣、安且燠兮。</p>
<p>《無衣》，二章，章三句。</p>
