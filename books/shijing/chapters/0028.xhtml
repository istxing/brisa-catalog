<h2>燕燕</h2>
<p>毛詩序：「《燕燕》，衞莊姜送歸妾也。」</p>
<h3>燕燕</h3>
<p>燕燕于飛，差池其羽，之子于歸，遠送于野，瞻望弗及，泣涕如雨。</p>
<p>燕燕于飛，頡之頏之，之子于歸，遠于將之，瞻望弗及，佇立以泣。</p>
<p>燕燕于飛，下上其音，之子于歸，遠送于南，瞻望弗及，實勞我心。</p>
<p>仲氏任只，其心塞淵，終溫且惠，淑慎其身，先君之思，以勗寡人。</p>
<p>《燕燕》，四章，章六句。</p>
<h3>註解</h3>
<p>于：往<br/>差池：長短不一<br/>頡：向下飛<br/>頏：向上飛<br/>佇：長久地站立<br/>勗：勖，勉勵，提醒</p>
</section></body>
