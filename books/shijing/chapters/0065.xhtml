<h2>黍離</h2>
<h3>國風‧王‧黍離</h3>
<p>毛詩序：「《黍離》，閔宗周也。周大夫行役，至于宗周，過故宗廟宮室，盡為禾黍。閔周室之顛覆，彷徨不忍去而作是詩也。」</p>
<h3>黍離</h3>
<p>彼黍離離，彼稷之苗。行邁靡靡，中心搖搖。知我者，謂我心憂，不知我者，謂我何求。悠悠蒼天，此何人哉！</p>
<p>彼黍離離，彼稷之穗。行邁靡靡，中心如醉。知我者，謂我心憂，不知我者，謂我何求。悠悠蒼天，此何人哉！</p>
<p>彼黍離離，彼稷之實。行邁靡靡，中心如噎。知我者，謂我心憂，不知我者，謂我何求。悠悠蒼天，此何人哉！</p>
<p>《黍離》，三章，章十句。</p>
