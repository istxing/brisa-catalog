<h2>考槃</h2>
<h3>國風‧衞‧考槃</h3>
<p>毛詩序：「《考槃》，刺莊公也。不能繼先公之業，使賢者退而窮處。」</p>
<h3>考槃</h3>
<p>考槃在澗，碩人之寬，獨寐寤言，永矢弗諼。</p>
<p>考槃在阿，碩人之薖，獨寐寤歌，永矢弗過。</p>
<p>考槃在陸，碩人之軸，獨寐寤宿，永矢弗告。</p>
<p>《考槃》，三章，章四句。</p>
