<h2>伯兮</h2>
<h3>國風‧衞‧伯兮</h3>
<p>毛詩序：「《伯兮》，刺時也。言君子行役，為王前驅，過時而不反焉。」</p>
<h3>伯兮</h3>
<p>伯兮朅兮，邦之桀兮。伯也執殳，爲王前驅。</p>
<p>自伯之東，首如飛蓬。豈無膏沐？誰適爲容！</p>
<p>其雨其雨，杲杲出日。願言思伯，甘心首疾。</p>
<p>焉得諼草？言樹之背。願言思伯。使我心痗。</p>
<p>《伯兮》，四章，章四句。</p>
