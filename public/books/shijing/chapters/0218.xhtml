<h2>大田</h2>
<h3>小雅‧甫田之什‧大田</h3>
<p>毛詩序：「《大田》，刺幽王也。言矜寡不能自存焉。」</p>
<h3>大田</h3>
<p>大田多稼，既種既戒。既備乃事，以我覃耜。</p>
<p>俶載南畝，播厥百穀。既庭且碩，曾孫是若。</p>
<p>既方既皁，既堅既好，不稂不莠。</p>
<p>去其螟螣，及其蟊賊，無害我田穉。</p>
<p>田祖有神，秉畀炎火。</p>
<p>有渰萋萋，興雨祁祁，雨我公田，遂及我私。</p>
<p>彼有不穫穉，此有不斂穧。彼有遺秉，此有滯穗。伊寡婦之利。</p>
<p>曾孫來止，以其婦子，饁彼南畝。田畯至喜。</p>
<p>來方禋祀，以其騂黑。與其黍稷，以享以祀，以介景福。</p>
<p>《大田》，四章：二章，章八句；二章，章九句。</p>
