<h2>靈臺</h2>
<h3>大雅‧文王之什‧靈臺</h3>
<p>毛詩序：「《靈臺》，民始附也。文王受命，而民樂其有靈德，以及鳥獸昆蟲焉。」</p>
<h3>靈臺</h3>
<p>經始靈臺，經之營之。庶民攻之，不日成之。</p>
<p>經始勿亟，庶民子來。王在靈囿，麀鹿攸伏。</p>
<p>麀鹿濯濯，白鳥翯翯。王在靈沼，於牣魚躍。</p>
<p>虡業維樅，賁鼓維鏞。於論鼓鍾，於樂辟廱。</p>
<p>於論鼓鍾，於樂辟廱。鼉鼓逢逢，矇瞍奏公。</p>
<p>《靈臺》，五章，章四句。</p>
