<h2>天保</h2>
<h3>小雅‧鹿鳴之什‧天保</h3>
<p>毛詩序：「《天保》，下報上也。君能下下以成其政，臣能歸美以報其上焉。」</p>
<h3>天保</h3>
<p>天保定爾，亦孔之固。俾爾單厚，何福不除？俾爾多益，以莫不庶。</p>
<p>天保定爾，俾爾戩穀。罄無不宜，受天百祿。降爾遐福，維日不足。</p>
<p>天保定爾，以莫不興！如山如阜，如岡如陵。如川之方至，以莫不增。</p>
<p>吉蠲為饎，是用孝享。禴祠烝嘗，于公先王。君曰卜爾，萬壽無疆！</p>
<p>神之弔矣，詒爾多福。民之質矣，日用飲食。羣黎百姓，徧為爾德。</p>
<p>如月之恆，如日之升。如南山之壽，不騫不崩。如松柏之茂，無不爾或承。</p>
<p>《天保》，六章，章六句。</p>
