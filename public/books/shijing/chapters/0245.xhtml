<h2>旱麓</h2>
<h3>大雅‧文王之什‧旱麓</h3>
<p>毛詩序：「《旱麓》，受祖也。周之先祖，世脩后稷公劉之業，大王王季申以百福干祿焉。」</p>
<h3>旱麓</h3>
<p>瞻彼旱麓，榛楛濟濟。豈弟君子，干祿豈弟。</p>
<p>瑟彼玉瓚，黃流在中。豈弟君子，福祿攸降。</p>
<p>鳶飛戾天，魚躍于淵。豈弟君子，遐不作人。</p>
<p>清酒既載，騂牡既備。以享以祀，以介景福。</p>
<p>瑟彼柞棫，民所燎矣。豈弟君子，神所勞矣。</p>
<p>莫莫葛藟，施于條枚。豈弟君子，求福不回。</p>
<p>《旱麓》，六章，章四句。</p>
