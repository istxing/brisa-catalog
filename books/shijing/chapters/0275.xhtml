<h2>烈文</h2>
<h3>周頌‧清廟之什‧烈文</h3>
<p>毛詩序：「《烈文》，成王即政，諸侯助祭也。」</p>
<h3>烈文</h3>
<p>烈文辟公，錫茲祉福。惠我無疆，子孫保之。</p>
<p>無封靡于爾邦，維王其崇之。念茲戎功，繼序其皇之。</p>
<p>無競維人，四方其訓之。不顯維德，百辟其刑之。</p>
<p>於乎前王不忘。</p>
<p>《烈文》，一章，十三句。</p>
