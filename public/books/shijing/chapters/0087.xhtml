<h2>褰裳</h2>
<h3>國風‧鄭‧褰裳</h3>
<p>毛詩序：「《褰裳》，思見正也。狂童恣行，國人思大國之正己也。」</p>
<h3>褰裳</h3>
<p>子惠思我，褰裳涉溱。子不我思，豈無他人？狂童之狂也且！</p>
<p>子惠思我，褰裳涉洧。子不我思，豈無他士？狂童之狂也且！</p>
<p>《褰裳》，二章，章五句。</p>
