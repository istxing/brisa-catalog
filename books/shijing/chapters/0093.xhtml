<h2>出其東門</h2>
<h3>國風‧鄭‧出其東門</h3>
<p>毛詩序：「《出其東門》，閔亂也。公子五爭，兵革不息，男女相棄，民人思保其室家焉。」</p>
<h3>出其東門</h3>
<p>出其東門，有女如雲。雖則如雲，匪我思存。縞衣綦巾，聊樂我員。</p>
<p>出其闉闍，有女如荼。雖則如荼，匪我思且。縞衣茹藘，聊可與娛。</p>
<p>《出其東門》，二章，章六句。</p>
