<h2>有女同車</h2>
<h3>國風‧鄭‧有女同車</h3>
<p>有女同車，顏如舜華，將翱將翔，佩玉瓊琚，彼美孟姜，洵美且都。</p>
<p>有女同行，顏如舜英，將翱將翔，佩玉將將，彼美孟姜，德音不忘。</p>
<p>《有女同車》，二章，章六句。</p>
