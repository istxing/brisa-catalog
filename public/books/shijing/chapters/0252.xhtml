<h2>行葦</h2>
<h3>大雅‧生民之什‧行葦</h3>
<p>毛詩序：「《行葦》，忠厚也。周家忠厚，仁及草木，故能內睦九族，外尊事黃耇，養老乞言，以成其福祿焉。」</p>
<h3>行葦</h3>
<p>敦彼行葦，牛羊勿踐履。方苞方體，維葉泥泥。</p>
<p>戚戚兄弟，莫遠具爾。或肆之筵，或授之几。</p>
<p>肆筵設席，授几有緝御。或獻或酢，洗爵奠斝。</p>
<p>醓醢以薦，或燔或炙。嘉殽脾臄，或歌或咢。</p>
<p>敦弓既堅，四鍭既鈞。舍矢既鈞，序賓以賢。</p>
<p>敦弓既句，既挾四鍭。四鍭如樹，序賓以不侮。</p>
<p>曾孫維主，酒醴維醹。酌以大斗，以祈黃耇。</p>
<p>黃耇台背，以引以翼，壽考維祺，以介景福。</p>
<p>《行葦》，八章，章四句。故言七章：二章，章六句；五章，章四句。</p>
