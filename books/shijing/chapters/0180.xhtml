<h2>湛露</h2>
<h3>小雅‧南有嘉魚之什‧湛露</h3>
<p>毛詩序：「《湛露》，天子燕諸侯也。」</p>
<h3>湛露</h3>
<p>湛湛露斯，匪陽不晞。厭厭夜飲，不醉無歸。</p>
<p>湛湛露斯，在彼豐草。厭厭夜飲，在宗載考。</p>
<p>湛湛露斯，在彼杞棘。顯允君子，莫不令德。</p>
<p>其桐其椅，其實離離。豈弟君子，莫不令儀。</p>
<p>《湛露》，四章，章四句。</p>
