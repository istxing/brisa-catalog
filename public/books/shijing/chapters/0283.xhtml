<h2>噫嘻</h2>
<h3>周頌‧臣工之什‧噫嘻</h3>
<p>毛詩序：「《噫嘻》，春夏祈穀于上帝也。」</p>
<h3>噫嘻</h3>
<p>噫嘻成王，既昭假爾，率時農夫，播厥百穀。</p>
<p>駿發爾私，終三十里，亦服爾耕，十千維耦。</p>
<p>《噫嘻》，一章，八句。</p>
