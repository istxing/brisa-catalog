<h2>清廟</h2>
<h3>周頌‧清廟之什‧清廟</h3>
<p>毛詩序：「《清廟》，祀文王也。周公既成洛邑，朝諸侯，率以祀文王焉。」</p>
<h3>清廟</h3>
<p>於穆清廟，肅雝顯相。</p>
<p>濟濟多士，秉文之德。</p>
<p>對越在天，駿奔走在廟。</p>
<p>不顯不承，無射於人斯。</p>
<p>《清廟》，一章，八句。</p>
