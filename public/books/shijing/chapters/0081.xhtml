<h2>遵大路</h2>
<h3>國風‧鄭‧遵大路</h3>
<p>毛詩序：「《遵大路》，思君子也。莊公失道，君子去之，國人思望焉。」</p>
<h3>遵大路</h3>
<p>遵大路兮，摻執子之袪兮。無我惡兮，不寁故也。</p>
<p>遵大路兮，摻執子之手兮。無我魗兮，不寁好也。</p>
<p>《遵大路》，二章，章四句。</p>
