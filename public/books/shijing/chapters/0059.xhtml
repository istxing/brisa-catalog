<h2>竹竿</h2>
<h3>國風‧衞‧竹竿</h3>
<p>毛詩序：「《竹竿》，衞女思歸也。適異國而不見荅，思而能以禮者也。」</p>
<h3>竹竿</h3>
<p>籊籊竹竿，以釣于淇，豈不爾思，遠莫致之。</p>
<p>泉源在左，淇水在右，女子有行，遠兄弟父母。</p>
<p>淇水在右，泉源在左，巧笑之瑳，佩玉之儺。</p>
<p>淇水滺滺，檜楫松舟，駕言出遊，以寫我憂。</p>
<p>《竹竿》，四章，章四句。</p>
