<h2>桓</h2>
<h3>周頌‧閔予小子之什‧桓</h3>
<p>毛詩序：「《桓》，講武類禡也。《桓》，武志也。」</p>
<h3>桓</h3>
<p>綏萬邦，婁豐年，天命匪解。</p>
<p>桓桓武王，保有厥士，于以四方。克定厥家。</p>
<p>於昭于天，皇以間之。</p>
<p>《桓》，一章，九句。</p>
