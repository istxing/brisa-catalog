<h2>候人</h2>
<h3>國風‧曹‧候人</h3>
<p>毛詩序：「《候人》，刺近小人也。共公遠君子而好近小人焉。」</p>
<h3>候人</h3>
<p>彼候人兮，何戈與祋。彼其之子，三百赤芾。</p>
<p>維鵜在梁，不濡其翼。彼其之子，不稱其服。</p>
<p>維鵜在梁，不濡其咮。彼其之子，不遂其媾。</p>
<p>薈兮蔚兮，南山朝隮。婉兮孌兮，季女斯飢。</p>
<p>《候人》，四章，章四句。</p>
