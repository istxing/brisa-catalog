<h2>備突</h2>
<p>城百步一突門，突門各爲窯竈，竇入門四五尺，爲亓門上瓦屋，毋令水潦能入門中。吏主塞突門，用車兩輪，以木束之，塗其上，維置突門內，使度門廣狹，令之入門中四五尺。置窯竈，門旁爲橐，充竈狀柴艾，寇即入，下輪而塞之，鼓橐而熏之。</p>
