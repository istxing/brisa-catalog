<h2>蓼蕭</h2>
<h3>小雅‧南有嘉魚之什‧蓼蕭</h3>
<p>毛詩序：「《蓼蕭》，澤及四海也。」</p>
<h3>蓼蕭</h3>
<p>蓼彼蕭斯，零露湑兮。既見君子，我心寫兮。燕笑語兮，是以有譽處兮。</p>
<p>蓼彼蕭斯，零露瀼瀼。既見君子，為龍為光。其德不爽，壽考不忘。</p>
<p>蓼彼蕭斯，零露泥泥。既見君子，孔燕豈弟。宜兄宜弟，令德壽豈。</p>
<p>蓼彼蕭斯，零露濃濃。既見君子，鞗革忡忡。和鸞雝雝，萬福攸同。</p>
<p>《蓼蕭》，四章，章六句。</p>
