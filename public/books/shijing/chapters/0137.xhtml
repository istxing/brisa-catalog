<h2>東門之枌</h2>
<h3>國風‧陳‧東門之枌</h3>
<p>毛詩序：「《東門之枌》，疾亂也。幽公淫荒，風化之所行，男女棄其舊業，亟會於道路，歌舞於市井爾。」</p>
<h3>東門之枌</h3>
<p>東門之枌，宛丘之栩。子仲之子，婆娑其下。</p>
<p>穀旦于差，南方之原。不績其麻，市也婆娑。</p>
<p>穀旦于逝，越以鬷邁。視爾如荍，貽我握椒。</p>
<p>《東門之枌》，三章，章四句。</p>
