<h2>載見</h2>
<h3>周頌‧臣工之什‧載見</h3>
<p>毛詩序：「《載見》，諸侯始見乎武王廟也。」</p>
<h3>載見</h3>
<p>載見辟王，曰求厥章。龍旂陽陽，和鈴央央。鞗革有鶬，休有烈光。</p>
<p>率見昭考，以孝以享，以介眉壽，永言保之，思皇多祜。</p>
<p>烈文辟公，綏以多福，俾緝熙于純嘏。</p>
<p>《載見》，一章，十四句。</p>
