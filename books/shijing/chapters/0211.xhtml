<h2>北山</h2>
<h3>小雅‧谷風之什‧北山</h3>
<p>毛詩序：「《北山》，大夫刺幽王也。役使不均，己勞於從事，而不得(終)養其父母焉。」</p>
<h3>北山</h3>
<p>陟彼北山，言采其杞。偕偕士子，朝夕從事。王事靡盬，憂我父母。</p>
<p>溥天之下，莫非王土。率土之濱，莫非王臣。大夫不均，我從事獨賢。</p>
<p>四牡彭彭，王事傍傍。嘉我未老，鮮我方將。旅力方剛，經營四方。</p>
<p>或燕燕居息，或盡瘁事國；或息偃在牀，或不已于行。</p>
<p>或不知叫號，或慘慘劬勞；或棲遲偃仰，或王事鞅掌。</p>
<p>或湛樂飲酒，或慘慘畏咎；或出入風議，或靡事不為。</p>
<p>《北山》，六章：三章，章六句；三章，章四句。</p>
