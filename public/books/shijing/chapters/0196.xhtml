<h2>無羊</h2>
<h3>小雅‧鴻鴈之什‧無羊</h3>
<p>毛詩序：「《無羊》，宣王考牧也。」</p>
<h3>無羊</h3>
<p>誰謂爾無羊？三百維羣。誰謂爾無牛？九十其犉。</p>
<p>爾羊來思，其角濈濈，爾牛來思，其耳濕濕。</p>
<p>或降于阿，或飲于池。或寢或訛，爾牧來思。</p>
<p>何蓑何笠，或負其餱。三十維物，爾牲則具。</p>
<p>爾牧來思，以薪以蒸。以雌以雄，爾羊來思。</p>
<p>矜矜兢兢，不騫不崩。麾之以肱，畢來既升。</p>
<p>牧人乃夢，衆維魚矣。旐維旟矣，大人占之。</p>
<p>衆維魚矣，實維豐年。旐維旟矣，室家溱溱。</p>
<p>《無羊》，四章，章八句。</p>
