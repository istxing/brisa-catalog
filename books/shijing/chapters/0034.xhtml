<h2>匏有苦葉</h2>
<h3>國風‧邶‧匏有苦葉</h3>
<p>毛詩序：「《匏有苦葉》，刺衞宣公也。公與夫人並為淫亂。」</p>
<h3>匏有苦葉</h3>
<p>匏有苦葉，濟有深涉，深則厲，淺則揭。</p>
<p>有瀰濟盈，有鷕雉鳴，濟盈不濡軌，雉鳴求其牡。</p>
<p>雝雝鳴鴈，旭日始旦，士如歸妻，迨冰未泮。</p>
<p>招招舟子，人涉卬否，人涉卬否，卬須我友。</p>
<p>《匏有苦葉》，四章，章四句。</p>
