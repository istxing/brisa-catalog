<h2>卷二十二</h2>
<h3>索隱述贊</h3>
<p>高祖初起，嘯命群雄。天下未定，王我漢中。三傑既得，六奇獻功。章邯已破，蕭何築宮。周勃厚重，硃虛至忠。陳平作相，條侯總戎。丙魏立志，湯堯飾躬。天漢之後，表述非功。</p>
