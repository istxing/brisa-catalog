<h2>山有樞</h2>
<h3>國風‧唐‧山有樞</h3>
<p>毛詩序：「《山有樞》，刺晉昭公也。不能脩道以正其國，有財不能用，有鍾鼓不能以自樂，有朝廷不能洒埽，政荒民散，將以危亡，四鄰謀取其國家而不知。國人作詩以刺之也。」</p>
<h3>山有樞</h3>
<p>山有樞，隰有榆。子有衣裳，弗曳弗婁。子有車馬，弗馳弗驅。宛其死矣，他人是愉。</p>
<p>山有栲，隰有杻。子有廷內，弗洒弗埽。子有鐘鼓，弗鼓弗考。宛其死矣，他人是保。</p>
<p>山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜樂，且以永日。宛其死矣，他人入室。</p>
<p>《山有樞》，三章，章八句。</p>
