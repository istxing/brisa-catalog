<h2>揚之水</h2>
<h3>國風‧鄭‧揚之水</h3>
<p>毛詩序：「《揚之水》，閔無臣也。君子閔忽之無忠臣良士，終以死亡而作是詩也。」</p>
<h3>鄭‧揚之水</h3>
<p>揚之水，不流束楚，終鮮兄弟，維予與女，無信人之言，人實迋女。</p>
<p>揚之水，不流束薪，終鮮兄弟，維予二人，無信人之言，人實不信！</p>
<p>《揚之水》，二章，章六句。</p>
