<h2>黍苗</h2>
<h3>小雅‧魚藻之什‧黍苗</h3>
<p>毛詩序：「《黍苗》，刺幽王也。不能膏潤天下，卿士不能行召伯之職焉。」</p>
<h3>黍苗</h3>
<p>芃芃黍苗，陰雨膏之。悠悠南行，召伯勞之。</p>
<p>我任我輦，我車我牛。我行既集，蓋云歸哉。</p>
<p>我徒我御，我師我旅。我行既集，蓋云歸處。</p>
<p>肅肅謝功，召伯營之。烈烈征師，召伯成之。</p>
<p>原隰既平，泉流既清。召伯有成，王心則寧。</p>
<p>《黍苗》，五章，章四句。</p>
