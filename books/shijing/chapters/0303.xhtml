<h2>駉</h2>
<h3>魯頌‧駉之什‧駉</h3>
<p>毛詩序：「《駉》，頌僖公也。僖公能遵伯禽之法，儉以足用，寬以愛民，務農重穀，牧于坰野，魯人尊之。於是季孫行父請命于周，而史克作是頌。」</p>
<h3>駉</h3>
<p>駉駉牡馬，在坰之野。<br/>薄言駉者，有驈有皇，有驪有黃，以車彭彭。<br/>思無疆，思馬斯臧。<br/>駉駉牡馬，在坰之野。<br/>薄言駉者，有騅有駓，有騂有騏，以車伾伾。<br/>思無期，思馬斯才。<br/>駉駉牡馬，在坰之野。<br/>薄言駉者，有驒有駱，有駵有雒，以車繹繹。<br/>思無斁，思馬斯作。<br/>駉駉牡馬，在坰之野。<br/>薄言駉者，有駰有騢，有驔有魚，以車祛祛。<br/>思無邪，思馬斯徂。</p>
<p>《駉》，四章，章八句。</p>
