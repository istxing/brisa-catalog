<h2>擊鼓</h2>
<h3>齊詩說</h3>
<p>擊鼓合戰，士怯叛亡，威令不行，敗我成功。</p>
<h3>毛詩序</h3>
<p>《擊鼓》，怨州吁也。衞州吁用兵暴亂，使公孫文仲將而平陳與宋，國人怨其勇而無禮也。</p>
<h3>擊鼓</h3>
<p>擊鼓其鏜，踴躍用兵，土國城漕，我獨南行。<br/>從孫子仲，平陳與宋，不我以歸，憂心有忡。<br/>爰居爰處，爰喪其馬，于以求之，于林之下。<br/>死生契闊，與子成說，執子之手，與子偕老。<br/>于嗟闊兮，不我活兮，于嗟洵兮，不我信兮。</p>
<p>《擊鼓》，五章，章四句。</p>
