<h2>緜蠻</h2>
<h3>小雅‧魚藻之什‧緜蠻</h3>
<p>毛詩序：「《緜蠻》，微臣刺亂也。大臣不用仁心，遺忘微賤，不肯飲食教載之，故作是詩也。」</p>
<h3>緜蠻</h3>
<p>緜蠻黃鳥，止于丘阿。道之云遠，我勞如何！</p>
<p>飲之食之，教之誨之。命彼後車，謂之載之。</p>
<p>緜蠻黃鳥，止于丘隅。豈敢憚行？畏不能趨。</p>
<p>飲之食之，教之誨之。命彼後車，謂之載之。</p>
<p>緜蠻黃鳥，止于丘側。豈敢憚行，畏不能極。</p>
<p>飲之食之，教之誨之。命彼後車，謂之載之。</p>
<p>《緜蠻》，三章，章八句。</p>
