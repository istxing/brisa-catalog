<h2>鴛鴦</h2>
<h3>小雅‧甫田之什‧鴛鴦</h3>
<p>毛詩序：「《鴛鴦》，刺幽王也。思古明王交於萬物有道，自奉養有節焉。」</p>
<h3>鴛鴦</h3>
<p>鴛鴦于飛，畢之羅之。君子萬年，福祿宜之。</p>
<p>鴛鴦在梁，戢其左翼。君子萬年，宜其遐福。</p>
<p>乘馬在廏，摧之秣之。君子萬年，福祿艾之。</p>
<p>乘馬在廏，秣之摧之。君子萬年，福祿綏之。</p>
<p>《鴛鴦》，四章，章四句。</p>
