<h2>柏舟</h2>
<h3>國風‧邶‧柏舟</h3>
<h3>柏舟</h3>
<p>毛詩序：「《柏舟》，言仁而不遇也。衞頃公之時，仁人不遇，小人在側。」</p>
<p>汎彼柏舟，亦汎其流。耿耿不寐，如有隱憂。微我無酒，以敖以遊。</p>
<p>我心匪鑒，不可以茹。亦有兄弟，不可以據。薄言往愬，逢彼之怒。</p>
<p>我心匪石，不可轉也。我心匪席，不可卷也。威儀棣棣，不可選也。</p>
<p>憂心悄悄，慍于群小。覯閔既多，受侮不少。靜言思之，寤辟有摽。</p>
<p>日居月諸，胡迭而微？心之憂矣，如匪澣衣。靜言思之，不能奮飛！</p>
