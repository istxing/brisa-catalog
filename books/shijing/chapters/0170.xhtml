<h2>魚麗</h2>
<h3>小雅‧鹿鳴之什‧魚麗</h3>
<p>毛詩序：「《魚麗》，美萬物盛多能備禮也。文武以天保以上治內，《采薇》以下治外；始於憂勤，終於逸樂，故美萬物盛多，可以告於神明矣。」</p>
<h3>魚麗</h3>
<p>魚麗于罶，鱨鯊。君子有酒，旨且多。</p>
<p>魚麗于罶，魴鱧。君子有酒，多且旨。</p>
<p>魚麗于罶，鰋鯉。君子有酒，旨且有。</p>
<p>物其多矣，維其嘉矣。</p>
<p>物其旨矣，維其偕矣。</p>
<p>物其有矣，維其時矣。</p>
<p>《魚麗》，六章：三章，章四句；三章，章二句。</p>
