<h2>桑扈</h2>
<h3>小雅‧甫田之什‧桑扈</h3>
<p>毛詩序：「《桑扈》，刺幽王也。君臣上下，動無禮文焉。」</p>
<h3>桑扈</h3>
<p>交交桑扈，有鶯其羽。君子樂胥，受天之祜。</p>
<p>交交桑扈，有鶯其領。君子樂胥，萬邦之屏。</p>
<p>之屏之翰，百辟為憲。不戢不難，受福不那。</p>
<p>兕觥其觩，旨酒思柔。彼交匪敖，萬福來求。</p>
<p>《桑扈》，四章，章四句。</p>
