<h2>猗嗟</h2>
<h3>國風‧齊‧猗嗟</h3>
<p>毛詩序：「《猗嗟》，刺魯莊公也。齊人傷魯莊公有威儀技藝，然而不能以禮防閑其母。失子之道，人以為齊侯之子焉。」</p>
<h3>猗嗟</h3>
<p>猗嗟昌兮！頎而長兮。抑若揚兮，美目揚兮。巧趨蹌兮。射則臧兮。</p>
<p>猗嗟名兮！美目清兮。儀既成兮，終日射侯，不出正兮，展我甥兮。</p>
<p>猗嗟孌兮！清揚婉兮。舞則選兮，射則貫兮，四矢反兮，以禦亂兮。</p>
<p>《猗嗟》，三章，章六句。</p>
