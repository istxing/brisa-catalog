<h2>椒聊</h2>
<h3>國風‧唐‧椒聊</h3>
<p>毛詩序：「《椒聊》，刺晉昭公也。君子見沃之盛彊，能脩其政，知其蕃衍盛大，子孫將有晉國焉。」</p>
<h3>椒聊</h3>
<p>椒聊之實，蕃衍盈升。彼其之子，碩大無朋。椒聊且！遠條且！</p>
<p>椒聊之實，蕃衍盈匊。彼其之子，碩大且篤。椒聊且！遠條且！</p>
<p>《椒聊》，二章，章六句。</p>
