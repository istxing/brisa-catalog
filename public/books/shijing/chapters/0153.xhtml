<h2>下泉</h2>
<h3>國風‧曹‧下泉</h3>
<p>毛詩序：「《下泉》，思治也。曹人疾共公侵刻下民，不得其所，憂而思明王賢伯也。」</p>
<h3>下泉</h3>
<p>洌彼下泉，浸彼苞稂。愾我寤嘆，念彼周京。</p>
<p>洌彼下泉，浸彼苞蕭。愾我寤嘆，念彼京周。</p>
<p>洌彼下泉，浸彼苞蓍。愾我寤嘆，念彼京師。</p>
<p>芃芃黍苗，陰雨膏之。四國有王，郇伯勞之。</p>
<p>《下泉》，四章，章四句。</p>
