<h2>武</h2>
<h3>周頌‧臣工之什‧武</h3>
<p>毛詩序：「《武》，奏大武也。」</p>
<h3>武</h3>
<p>於皇武王，無競維烈。</p>
<p>允文文王，克開厥後。</p>
<p>嗣武受之。勝殷遏劉，耆定爾功。</p>
<p>《武》，一章，七句。</p>
