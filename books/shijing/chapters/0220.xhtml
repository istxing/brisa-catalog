<h2>裳裳者華</h2>
<h3>小雅‧甫田之什‧裳裳者華</h3>
<p>毛詩序：「《裳裳者華》，刺幽王也。古之仕者世祿，小人在位，則讒諂並進，棄賢者之類，絕功臣之世焉。」</p>
<h3>裳裳者華</h3>
<p>裳裳者華，其葉湑兮。我覯之子，我心寫兮。我心寫兮，是以有譽處兮。</p>
<p>裳裳者華，芸其黃矣。我覯之子，維其有章矣。維其有章矣，是以有慶矣。</p>
<p>裳裳者華，或黃或白。我覯之子，乘其四駱。乘其四駱，六轡沃若。</p>
<p>左之左之，君子宜之。右之右之，君子有之。維其有之，是以似之。</p>
<p>《裳裳者華》，四章，章六句。</p>
