<h2>大叔于田</h2>
<h3>國風‧鄭‧大叔于田</h3>
<p>毛詩序：「《大叔于田》，刺莊公也。叔多才而好勇，不義而得衆也。」</p>
<h3>大叔于田</h3>
<p>大叔于田，乘乘馬。執轡如組，兩驂如舞。叔在藪，火烈具舉，襢裼暴虎，獻于公所。將叔無狃，戒其傷女。</p>
<p>大叔于田，乘乘黃。兩服上襄，兩驂鴈行。叔在藪，火烈具揚。叔善射忌，又良御忌，抑磬控忌，抑縱送忌。</p>
<p>大叔于田，乘乘鴇。兩服齊首，兩驂如手。叔在藪，火烈具阜。叔馬慢忌，叔發罕忌，抑釋掤忌，抑鬯弓忌。</p>
<p>《大叔于田》，三章，章十句。</p>
