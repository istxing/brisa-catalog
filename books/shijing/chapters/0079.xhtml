<h2>清人</h2>
<h3>國風‧鄭‧清人</h3>
<p>毛詩序：「《清人》，刺文公也。高克好利而不顧其君，文公惡而欲遠之。不能，使高克將兵而禦狄于竟。陳其師旅，翱翔河上，久而不召，衆散而歸。高克奔陳。公子素惡高克，進之不以禮，文公退之不以道，危國亡師之本。故作是詩也。」</p>
<h3>清人</h3>
<p>清人在彭，駟介旁旁。二矛重英，河上乎翱翔。</p>
<p>清人在消，駟介麃麃。二矛重喬，河上乎逍遙。</p>
<p>清人在軸，駟介陶陶。左旋右抽，中軍作好。</p>
<p>《清人》，三章，章四句。</p>
