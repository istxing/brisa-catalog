<h2>中谷有蓷</h2>
<h3>國風‧王‧中谷有蓷</h3>
<p>毛詩序：「《中谷有蓷》，閔周也。夫婦日以衰薄，凶年饑饉，室家相棄爾。」</p>
<h3>中谷有蓷</h3>
<p>中谷有蓷，暵其乾矣。有女仳離，嘅其嘆矣。嘅其嘆矣！遇人之艱難矣！</p>
<p>中谷有蓷，暵其脩矣。有女仳離，條其歗矣。條其歗矣！遇人之不淑矣！</p>
<p>中谷有蓷，暵其濕矣。有女仳離，啜其泣矣。啜其泣矣！何嗟及矣！</p>
<p>《中谷有蓷》，三章，章六句。</p>
