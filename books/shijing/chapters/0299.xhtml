<h2>酌</h2>
<h3>周頌‧閔予小子之什‧酌</h3>
<p>毛詩序：「《酌》，告成大武也。言能酌先祖之道，以養天下也。」</p>
<h3>酌</h3>
<p>於鑠王師，遵養時晦。時純熙矣，是用大介。</p>
<p>我龍受之，蹻蹻王之造。載用有嗣，實維爾公。</p>
<p>允師。</p>
<p>《酌》，一章，九句。</p>
