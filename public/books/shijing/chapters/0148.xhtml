<h2>隰有萇楚</h2>
<h3>國風‧檜‧隰有萇楚</h3>
<p>毛詩序：「《隰有萇楚》，疾恣也。國人疾其君之淫恣，而思無情慾者也。」</p>
<h3>隰有萇楚</h3>
<p>隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知。</p>
<p>隰有萇楚，猗儺其華。夭之沃沃，樂子之無家。</p>
<p>隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。</p>
<p>《隰有萇楚》，三章，章四句。</p>
