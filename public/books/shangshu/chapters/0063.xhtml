<h2>費誓</h2>
<h3>《尚書·費誓》</h3>
<p>公曰：「嗟！人無嘩，聽命。徂兹淮夷、徐戎并興，善敹（選）乃甲胄，敿乃干，無敢不弔（淑）。備乃弓矢，鍛乃戈矛，礪乃鋒刃，無敢不善。今惟淫舍牿牛馬，杜乃擭，敜乃穽，無敢傷牿。牿之傷，汝則有常刑。馬牛其風，臣妾逋逃，勿敢越逐，祗復之，我商（賞）賚汝。乃越逐不復，汝則有常刑。無敢寇攘，逾垣墻，竊馬牛，誘臣妾，汝則有常刑。甲戌，我惟征徐戎。峙乃糗糧，無敢不逮，汝則有大刑。魯人三郊三遂，峙乃楨榦。甲戌，我惟筑，無敢不供，汝則有無餘刑，非殺。魯人三郊三遂，峙乃芻茭，無敢不多，汝則有大刑。」</p>
