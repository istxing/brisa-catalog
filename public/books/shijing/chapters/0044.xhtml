<h2>二子乘舟</h2>
<h3>國風‧邶‧二子乘舟</h3>
<p>毛詩序：「《二子乘舟》，思伋、壽也。衞宣公之二子，爭相為死，國人傷而思之，作是詩也。」</p>
<h3>二子乘舟</h3>
<p>二子乘舟，汎汎其景，願言思子，中心養養。</p>
<p>二子乘舟，汎汎其逝，願言思子，不瑕有害。</p>
<p>《二子乘舟》，二章，章四句。</p>
