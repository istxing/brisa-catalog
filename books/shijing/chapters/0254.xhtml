<h2>鳬鷖</h2>
<h3>大雅‧生民之什‧鳧鷖</h3>
<p>毛詩序：「《鳧鷖》，守成也。大平之君子，能持盈守成，神祇祖考安樂之也。」</p>
<h3>鳧鷖</h3>
<p>鳧鷖在涇，公尸來燕來寧。爾酒既清，爾殽既馨。公尸燕飲，福祿來成。</p>
<p>鳧鷖在沙，公尸來燕來宜。爾酒既多，爾殽既嘉。公尸燕飲，福祿來為。</p>
<p>鳧鷖在渚，公尸來燕來處。爾酒既湑，爾殽伊脯。公尸燕飲，福祿來下。</p>
<p>鳧鷖在潀，公尸來燕來宗。既燕于宗，福祿攸降。公尸燕飲，福祿來崇。</p>
<p>鳧鷖在亹，公尸來止熏熏。旨酒欣欣，燔炙芬芬。公尸燕飲，無有後艱。</p>
<p>《鳧鷖》，五章，章六句。</p>
