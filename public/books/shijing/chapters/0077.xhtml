<h2>叔于田</h2>
<h3>國風‧鄭‧叔于田</h3>
<p>毛詩序：「《叔于田》，刺莊公也。叔處于京，繕甲治兵，以出于田，國人說而歸之。」</p>
<h3>叔于田</h3>
<p>叔于田，巷無居人。豈無居人，不如叔也。洵美且仁。</p>
<p>叔于狩，巷無飲酒。豈無飲酒，不如叔也。洵美且好。</p>
<p>叔適野，巷無服馬。豈無服馬，不如叔也。洵美且武。</p>
<p>《叔于田》，三章，章五句。</p>
