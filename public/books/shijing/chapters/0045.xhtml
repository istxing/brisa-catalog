<h2>柏舟</h2>
<h3>國風‧鄘‧柏舟</h3>
<p>毛詩序：「《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義，父母欲奪而嫁之，誓而弗許；故作是詩以絕之。」</p>
<h3>柏舟</h3>
<p>汎彼柏舟，在彼中河，髧彼兩髦，實維我儀，之死矢靡它，母也天只，不諒人只。</p>
<p>汎彼柏舟，在彼河側，髧彼兩髦，實維我特，之死矢靡慝，母也天只，不諒人只。</p>
<p>《柏舟》，二章，章七句。</p>
