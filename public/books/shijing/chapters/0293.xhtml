<h2>訪落</h2>
<h3>周頌‧閔予小子之什‧訪落</h3>
<p>毛詩序：「《訪落》，嗣王謀於廟也。」</p>
<h3>訪落</h3>
<p>訪予落止，率時昭考。</p>
<p>於乎悠哉！朕未有艾。將予就之，繼猶判渙。</p>
<p>維予小子，未堪家多難。紹庭上下，陟降厥家。</p>
<p>休矣皇考！以保明其身。</p>
<p>《訪落》，一章，十二句。</p>
