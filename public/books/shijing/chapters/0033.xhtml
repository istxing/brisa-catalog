<h2>雄雉</h2>
<p>毛詩序：「《雄雉》，刺衞宣公也。淫亂不恤國事，軍旅數起，大夫久役，男女怨曠，國人患之而作是詩。」</p>
<h3>雄雉</h3>
<p>雄雉于飛，泄泄其羽，我之懷矣，自詒伊阻。</p>
<p>雄雉于飛，下上其音，展矣君子，實勞我心。</p>
<p>瞻彼日月，悠悠我思，道之云遠，曷云能來。</p>
<p>百爾君子，不知德行，不忮不求，何用不臧。</p>
<p>《雄雉》，四章，章四句。</p>
