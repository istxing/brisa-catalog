<h2>桑中</h2>
<h3>國風‧鄘‧桑中</h3>
<p>毛詩序：「《桑中》，刺奔也，衞之公室淫亂，男女相奔，至于世族在位，相竊妻妾，期於幽遠，政散民流，而不可止。」</p>
<h3>桑中</h3>
<p>爰采唐矣，沬之鄉矣，云誰之思，美孟姜矣，期我乎桑中，要我乎上宮，送我乎淇之上矣。</p>
<p>爰采麥矣，沬之北矣，云誰之思，美孟弋矣，期我乎桑中，要我乎上宮，送我乎淇之上矣。</p>
<p>爰采葑矣，沬之東矣，云誰之思，美孟庸矣，期我乎桑中，要我乎上宮，送我乎淇之上矣。</p>
<p>《桑中》，三章，章七句。</p>
