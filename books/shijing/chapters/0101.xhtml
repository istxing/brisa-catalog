<h2>南山</h2>
<h3>國風‧齊‧南山</h3>
<p>毛詩序：「《南山》，刺襄公也。鳥獸之行，淫乎其妹，大夫遇是惡，作詩而去之。」</p>
<h3>南山</h3>
<p>南山崔崔，雄狐綏綏。魯道有蕩，齊子由歸。既曰歸止，曷又懷止！</p>
<p>葛屨五兩，冠緌雙止。魯道有蕩，齊子庸止。既曰庸止，曷又從止！</p>
<p>蓺麻如之何？衡從其畝。取妻如之何？必告父母，既曰告止，曷又鞠止！</p>
<p>析薪如之何？匪斧不克。取妻如之何？匪媒不得，既曰得止，曷又極止！</p>
<p>《南山》，四章，章六句。</p>
