<h2>蝃蝀</h2>
<h3>國風‧鄘‧蝃蝀</h3>
<p>毛詩序：「《蝃蝀》，止奔也。衞文公能以道化其民，淫奔之恥，國人不齒也。」</p>
<h3>蝃蝀</h3>
<p>蝃蝀在東，莫之敢指，女子有行，遠父母兄弟。</p>
<p>朝隮于西，崇朝其雨，女子有行，遠兄弟父母。</p>
<p>乃如之人也，懷昏姻也，大無信也，不知命也。</p>
<p>《蝃蝀》，三章，章四句。</p>
