<h2>下武</h2>
<h3>大雅‧文王之什‧下武</h3>
<p>毛詩序：「《下武》，繼文也。武王有聖德，復受天命，能昭先人之功焉。」</p>
<h3>下武</h3>
<p>下武維周，世有哲王。三后在天，王配于京。</p>
<p>王配于京，世德作求。永言配命，成王之孚。</p>
<p>成王之孚，下土之式。永言孝思，孝思維則。</p>
<p>媚茲一人，應侯順德。永言孝思，昭哉嗣服。</p>
<p>昭茲來許，繩其祖武。於萬斯年，受天之祜。</p>
<p>受天之祜，四方來賀。於萬斯年，不遐有佐。</p>
<p>《下武》，六章，章四句。</p>
