<h2>丰</h2>
<h3>國風‧鄭‧丰</h3>
<p>毛詩序：「《丰》，刺亂也。婚姻之道缺，陽倡而陰不和，男行而女不隨。」</p>
<h3>丰</h3>
<p>子之丰兮，俟我乎巷兮。悔予不送兮。</p>
<p>子之昌兮，俟我乎堂兮。悔予不將兮。</p>
<p>衣錦褧衣，裳錦褧裳。叔兮伯兮，駕予與行。</p>
<p>裳錦褧裳，衣錦褧衣。叔兮伯兮，駕予與歸。</p>
<p>《丰》，四章：二章，章三句；二章，章四句。</p>
