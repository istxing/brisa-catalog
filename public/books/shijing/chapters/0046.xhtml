<h2>牆有茨</h2>
<h3>國風‧鄘‧牆有茨</h3>
<p>毛詩序：「《牆有茨》，衞人刺其上也。公子頑通乎君母，國人疾之，而不可道也。」</p>
<h3>牆有茨</h3>
<p>牆有茨，不可埽也，中冓之言，不可道也，所可道也，言之醜也。</p>
<p>牆有茨，不可襄也，中冓之言，不可詳也，所可詳也，言之長也。</p>
<p>牆有茨，不可束也，中冓之言，不可讀也，所可讀也，言之辱也。</p>
<p>《牆有茨》，三章，章六句。</p>
