<h2>我行其野</h2>
<h3>小雅‧鴻鴈之什‧我行其野</h3>
<p>毛詩序：「《我行其野》，刺宣王也。」</p>
<h3>我行其野</h3>
<p>我行其野，蔽芾其樗。昏姻之故，言就爾居。爾不我畜，復我邦家。</p>
<p>我行其野，言采其蓫。昏姻之故，言就爾宿。爾不我畜，言歸斯復。</p>
<p>我行其野，言采其葍。不思舊姻，求爾新特。成不以富，亦祗以異。</p>
<p>《我行其野》，三章，章六句。</p>
