<h2>蜉蝣</h2>
<h3>國風‧曹‧蜉蝣</h3>
<p>毛詩序：「《蜉蝣》，刺奢也。昭公國小而迫，無法以自守，好奢而任小人，將無所依焉。」</p>
<h3>蜉蝣</h3>
<p>蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。</p>
<p>蜉蝣之翼，采采衣服。心之憂矣，於我歸息。</p>
<p>蜉蝣掘閱，麻衣如雪。心之憂矣，於我歸說。</p>
<p>《蜉蝣》，三章，章四句。</p>
