<h2>素冠</h2>
<h3>國風‧檜‧素冠</h3>
<p>毛詩序：「《素冠》，刺不能三年也。」</p>
<h3>素冠</h3>
<p>庶見素冠兮，棘人欒欒兮，勞心慱慱兮。</p>
<p>庶見素衣兮，我心傷悲兮，聊與子同歸兮。</p>
<p>庶見素韠兮，我心蘊結兮，聊與子如一兮。</p>
<p>《素冠》，三章，章三句。</p>
