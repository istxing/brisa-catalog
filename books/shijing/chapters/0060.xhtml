<h2>芄蘭</h2>
<h3>國風‧衞‧芄蘭</h3>
<p>毛詩序：「《芄蘭》，刺惠公也。驕而無禮，大夫刺之。」</p>
<h3>芄蘭</h3>
<p>芄蘭之支，童子佩觿，雖則佩觿，能不我知，容兮遂兮，垂帶悸兮。</p>
<p>芄蘭之葉，童子佩韘，雖則佩韘，能不我甲，容兮遂兮，垂帶悸兮。</p>
<p>《芄蘭》，二章，章六句。</p>
