<h2>沔水</h2>
<h3>小雅‧鴻鴈之什‧沔水</h3>
<p>毛詩序：「《沔水》，規宣王也。」</p>
<h3>沔水</h3>
<p>沔彼流水，朝宗于海。鴥彼飛隼，載飛載止。</p>
<p>嗟我兄弟，邦人諸友。莫肯念亂，誰無父母？</p>
<p>沔彼流水，其流湯湯。鴥彼飛隼，載飛載揚。</p>
<p>念彼不蹟，載起載行。心之憂矣，不可弭忘。</p>
<p>鴥彼飛隼，率彼中陵。</p>
<p>民之訛言，寧莫之懲？我友敬矣，讒言其興。</p>
<p>《沔水》，三章：二章，章八句；一章，章六句。</p>
