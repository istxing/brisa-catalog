<h2>綢繆</h2>
<h3>國風‧唐‧綢繆</h3>
<p>毛詩序：「《綢繆》，刺晉亂也。國亂則婚姻不得其時焉。」</p>
<h3>綢繆</h3>
<p>綢繆束薪，三星在天。今夕何夕？見此良人！子兮子兮！如此良人何！</p>
<p>綢繆束芻，三星在隅。今夕何夕？見此邂逅！子兮子兮！如此邂逅何！</p>
<p>綢繆束楚，三星在戶。今夕何夕？見此粲者！子兮子兮！如此粲者何！</p>
<p>《綢繆》，三章，章六句。</p>
