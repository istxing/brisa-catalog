<h2>園有桃</h2>
<h3>國風‧魏‧園有桃</h3>
<p>毛詩序：「《園有桃》，刺時也。大夫憂其君國小而迫，而儉以嗇，不能用其民。而無德教，日以侵削，故作是詩也。」</p>
<h3>園有桃</h3>
<p>園有桃，其實之殽。心之憂矣，我歌且謠。不知我者，謂我士也驕。彼人是哉，子曰何其？心之憂矣！其誰知之？其誰知之？蓋亦勿思！</p>
<p>園有棘，其實之食。心之憂矣，聊以行國。不我知者，謂我士也罔極。彼人是哉，子曰何其？心之憂矣！其誰知之？其誰知之？蓋亦勿思！</p>
<p>《園有桃》，二章，章十二句。</p>
