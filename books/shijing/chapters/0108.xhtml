<h2>汾沮洳</h2>
<h3>國風‧魏‧汾沮洳</h3>
<p>毛詩序：「《汾沮洳》，刺儉也。其君儉以能勤，刺不得禮也。」</p>
<h3>汾沮洳</h3>
<p>彼汾沮洳，言采其莫。彼其之子，美無度；美無度，殊異乎公路。</p>
<p>彼汾一方，言采其桑。彼其之子，美如英；美如英，殊異乎公行。</p>
<p>彼汾一曲，言采其藚。彼其之子，美如玉；美如玉，殊異乎公族。</p>
<p>《汾沮洳》，三章，章六句。</p>
