<h2>車鄰</h2>
<h3>國風‧秦‧車鄰</h3>
<p>毛詩序：「《車鄰》，美秦仲也。秦仲始大，有車馬禮樂侍御之好焉。」</p>
<h3>車鄰</h3>
<p>有車鄰鄰，有馬白顛。未見君子，寺人之令。</p>
<p>阪有漆，隰有栗。既見君子，並坐鼓瑟。今者不樂，逝者其耋。</p>
<p>阪有桑，隰有楊。既見君子，並坐鼓簧。今者不樂，逝者其亡。</p>
<p>《車鄰》三章：一章四句；二章，章六句。</p>
