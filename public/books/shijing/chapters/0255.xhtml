<h2>假樂</h2>
<h3>大雅‧生民之什‧假樂</h3>
<p>毛詩序：「《假樂》，嘉成王也。」</p>
<h3>假樂</h3>
<p>假樂君子，顯顯令德。宜民宜人，受祿于天。保右命之，自天申之。</p>
<p>干祿百福，子孫千億。穆穆皇皇，宜君宜王。不愆不忘，率由舊章。</p>
<p>威儀抑抑，德音秩秩。無怨無惡，率由羣匹。受福無疆，四方之綱。</p>
<p>之綱之紀，燕及朋友。百辟卿士，媚于天子。不解于位，民之攸塈。</p>
<p>《假樂》，四章，章六句。</p>
