<h2>葛生</h2>
<h3>國風‧唐‧葛生</h3>
<p>毛詩序：「《葛生》，刺晉獻公也。好攻戰，則國人多喪矣。」</p>
<h3>葛生</h3>
<p>葛生蒙楚，蘞蔓于野。予美亡此，誰與獨處。</p>
<p>葛生蒙棘，蘞蔓于域。予美亡此，誰與獨息。</p>
<p>角枕粲兮，錦衾爛兮。予美亡此，誰與獨旦。</p>
<p>夏之日，冬之夜。百歲之後，歸于其居。</p>
<p>冬之夜，夏之日。百歲之後，歸于其室。</p>
<p>《葛生》，五章，章四句。</p>
