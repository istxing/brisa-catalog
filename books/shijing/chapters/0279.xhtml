<h2>時邁</h2>
<h3>周頌‧清廟之什‧時邁</h3>
<p>毛詩序：「《時邁》，巡守告祭柴望也。」</p>
<h3>時邁</h3>
<p>時邁其邦，昊天其子之。</p>
<p>實右序有周，薄言震之，莫不震疊。</p>
<p>懷柔百神，及河喬嶽。允王維后。</p>
<p>明昭有周，式序在位。</p>
<p>載戢干戈，載櫜弓矢。</p>
<p>我求懿德，肆于時夏。</p>
<p>允王保之。</p>
<p>《時邁》，一章，十五句。</p>
