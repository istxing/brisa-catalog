<h2>無衣</h2>
<h3>國風‧秦‧無衣</h3>
<p>毛詩序：「《無衣》，刺用兵也。秦人刺其君，好攻戰亟用兵，而不與民同欲焉。」</p>
<h3>無衣</h3>
<p>豈曰無衣、與子同袍。</p>
<p>王于興師、脩我戈矛、與子同仇。</p>
<p>豈曰無衣、與子同澤。</p>
<p>王于興師、脩我矛戟、與子偕作。</p>
<p>豈曰無衣、與子同裳。</p>
<p>王于興師、脩我甲兵、與子偕行。</p>
<p>《無衣》，三章，章五句。</p>
