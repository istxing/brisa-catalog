<h2>木瓜</h2>
<h3>國風‧衞‧木瓜</h3>
<p>毛詩序：「《木瓜》，美齊桓公也。衞國有狄人之敗，出處于漕，齊桓公救而封之，遺之車馬器服焉，衞人思之，欲厚報之，而作是詩也。」</p>
<h3>木瓜</h3>
<p>投我以木瓜，報之以瓊琚，匪報也，永以為好也。</p>
<p>投我以木桃，報之以瓊瑤，匪報也，永以為好也。</p>
<p>投我以木李，報之以瓊玖，匪報也，永以為好也。</p>
<p>《木瓜》，三章，章四句。</p>
<h3>註解</h3>
<p>瓊琚:赤玉做的珮飾</p>
<p>瓊瑤:精美的玉石</p>
<p>瓊玖:黑色的玉</p>
</section></body>
