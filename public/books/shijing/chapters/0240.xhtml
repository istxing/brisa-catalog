<h2>何草不黃</h2>
<h3>小雅‧魚藻之什‧何草不黃</h3>
<p>毛詩序：「《何草不黃》，下國刺幽王也。四夷交侵，中國背叛，用兵不息，視民如禽獸。君子憂之，故作是詩也。」</p>
<h3>何草不黃</h3>
<p>何草不黃？何日不行？何人不將？經營四方。</p>
<p>何草不玄？何人不矜？哀我征夫，獨為匪民。</p>
<p>匪兕匪虎，率彼曠野。哀我征夫，朝夕不暇。</p>
<p>有芃者狐，率彼幽草。有棧之車，行彼周道。</p>
<p>《何草不黃》，四章，章四句。</p>
