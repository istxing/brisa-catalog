<h2>伐檀</h2>
<h3>國風‧魏‧伐檀</h3>
<p>毛詩序：「《伐檀》，刺貪也。在位貪鄙，無功而受祿，君子不得進仕爾。」</p>
<h3>伐檀</h3>
<p>坎坎伐檀兮，寘之河之干兮，河水清且漣猗。不稼不穡，胡取禾三百廛兮！不狩不獵，胡瞻爾庭有縣貆兮。彼君子兮，不素餐兮。</p>
<p>坎坎伐輻兮，寘之河之側兮，河水清且直猗。不稼不穡，胡取禾三百億兮！不狩不獵，胡瞻爾庭有縣特兮。彼君子兮，不素食兮。</p>
<p>坎坎伐輪兮，寘之河之漘兮，河水清且淪猗。不稼不穡，胡取禾三百囷兮！不狩不獵，胡瞻爾庭有縣鶉兮。彼君子兮，不素飧兮。</p>
<p>《伐檀》，三章，章九句。</p>
