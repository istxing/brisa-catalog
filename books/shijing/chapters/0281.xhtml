<h2>思文</h2>
<h3>周頌‧清廟之什‧思文</h3>
<p>毛詩序：「《思文》，后稷配天也。」</p>
<h3>思文</h3>
<p>思文后稷，克配彼天。立我烝民，莫匪爾極。</p>
<p>貽我來牟，帝命率育，無此疆爾界，陳常于時夏。</p>
<p>《思文》，一章，八句。</p>
