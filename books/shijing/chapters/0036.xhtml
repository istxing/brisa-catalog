<h2>式微</h2>
<h3>國風‧邶‧式微</h3>
<p>毛詩序：「《式微》，黎侯寓于衞，其臣勸以歸也。」</p>
<h3>式微</h3>
<p>式微式微，胡不歸？微君之故，胡為乎中露？</p>
<p>式微式微，胡不歸？微君之躬，胡為乎泥中？</p>
<p>《式微》，二章，章四句。</p>
<h3>註解</h3>
<p>式：发声词，无意义。</p>
<p>微：微小。</p>
<p>式微式微：按鲁诗，即微乎其微。十分渺小、卑贱。</p>
<p>胡不归：何不归去？</p>
<p>微君之故：此处微字作“非”解。即“若非因为君的缘故”</p>
<p>中露：倒桩，即露中。此处露为路的通假字。即路中。</p>
</section></body>
