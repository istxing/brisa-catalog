<h2>都人士</h2>
<h3>小雅‧魚藻之什‧都人士</h3>
<p>毛詩序：「《都人士》，周人刺衣服無常也。古者長民，衣服不貳，從容有常，以齊其民，則民德歸壹。傷今不復見古人也。」</p>
<h3>都人士</h3>
<p>彼都人士，狐裘黃黃。其容不改，出言有章。行歸于周，萬民所望。</p>
<p>彼都人士，臺笠緇撮。彼君子女，綢直如髮。我不見兮，我心不說。</p>
<p>彼都人士，充耳琇實。彼君子女，謂之尹吉。我不見兮，我心苑結。</p>
<p>彼都人士，垂帶而厲。彼君子女，卷髮如蠆。我不見兮，言從之邁。</p>
<p>匪伊垂之，帶則有餘。匪伊卷之，髮則有旟。我不見兮，云何盱矣。</p>
<p>《都人士》，五章，章六句。</p>
