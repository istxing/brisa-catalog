<h2>碩人</h2>
<h3>國風‧衞‧碩人</h3>
<p>毛詩序：「《碩人》，閔莊姜也。莊公惑於嬖妾，使驕上僭，莊姜賢而不荅，終以無子，國人閔而憂之。」</p>
<h3>碩人</h3>
<p>碩人其頎，衣錦褧衣，齊侯之子，衛侯之妻，東宮之妹，邢侯之姨，譚公維私。</p>
<p>手如柔荑，膚如凝脂，領如蝤蠐，齒如瓠犀，螓首蛾眉，巧笑倩兮，美目盼兮。</p>
<p>碩人敖敖，說于農郊，四牡有驕，朱幩鑣鑣，翟茀以朝，大夫夙退，無使君勞。</p>
<p>河水洋洋，北流活活，施罛濊濊，鱣鮪發發，葭菼揭揭，庶姜孽孽，庶士有朅。</p>
<p>《碩人》，四章，章七句。</p>
