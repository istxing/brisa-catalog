<h2>汝墳</h2>
<h3>國風‧周南‧汝墳</h3>
<h3>毛詩序</h3>
<p>《汝墳》，道化行也。文王之化，行乎汝墳之國，婦人能閔其君子，猶勉之以正也。</p>
<h3>詩文</h3>
<p>遵彼汝墳，伐其條枚，未見君子，惄如調飢。</p>
<p>遵彼汝墳，伐其條肄，既見君子，不我遐棄。</p>
<p>魴魚赬尾，王室如燬，雖則如燬，父母孔邇。</p>
<p>《汝墳》，三章，章四句。</p>
