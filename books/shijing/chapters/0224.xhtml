<h2>車舝</h2>
<h3>小雅‧甫田之什‧車舝</h3>
<p>毛詩序：「《車舝》，大夫刺幽王也。褒姒嫉妒，無道並進，讒巧敗國，德澤不加於民。周人思得賢女以配君子，故作是詩也。」</p>
<h3>車舝</h3>
<p>間關車之舝兮，思孌季女逝兮。匪飢匪渴，德音來括。雖無好友，式燕且喜。</p>
<p>依彼平林，有集維鷮。辰彼碩女，令德來教。式燕且譽，好爾無射。</p>
<p>雖無旨酒，式飲庶幾。雖無嘉殽，式食庶幾。雖無德與女，式歌且舞。</p>
<p>陟彼高岡，析其柞薪。析其柞薪，其葉湑兮。鮮我覯爾，我心寫兮。</p>
<p>高山仰止，景行行止。四牡騑騑，六轡如琴。覯爾新昏，以慰我心。</p>
<p>《車舝》，五章，章六句。</p>
