<h2>丘中有麻</h2>
<h3>國風‧王‧丘中有麻</h3>
<p>毛詩序：「《丘中有麻》，思賢也。莊王不明，賢人放逐，國人思之而作是詩也。」</p>
<h3>丘中有麻</h3>
<p>丘中有麻，彼留子嗟。彼留子嗟，將其來施施。</p>
<p>丘中有麥，彼留子國。彼留子國，將其來食。</p>
<p>丘中有李，彼留之子。彼留之子，貽我佩玖。</p>
<p>《丘中有麻》，三章，章四句。</p>
