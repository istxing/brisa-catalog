<h2>殷武</h2>
<h3>商頌‧殷武</h3>
<p>毛詩序：「《殷武》，祀高宗也。」</p>
<h3>殷武</h3>
<p>撻彼殷武，奮伐荊楚。<br/>罙入其阻，裒荊之旅。<br/>有截其所，湯孫之緒。<br/>維女荊楚，居國南鄉。<br/>昔有成湯，自彼氐羌。<br/>莫敢不來享，莫敢不來王。<br/>曰商是常。<br/>天命多辟，設都于禹之績。<br/>歲事來辟，勿予禍適，稼穡匪解。<br/>天命降監，下民有嚴。<br/>不僭不濫，不敢怠遑。<br/>命于下國，封建厥福。<br/>商邑翼翼，四方之極。<br/>赫赫厥聲，濯濯厥靈。<br/>壽考且寧，以保我後生。<br/>陟彼景山，松柏丸丸。<br/>是斷是遷，方斵是虔。<br/>松桷有梴，旅楹有閑，寢成孔安。</p>
<p>《殷武》，六章：三章，章六句；二章，章七句；一章，五句。</p>
