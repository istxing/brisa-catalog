<h2>防有鵲巢</h2>
<h3>國風‧陳‧防有鵲巢</h3>
<p>毛詩序：「《防有鵲巢》，憂讒賊也。宣公多信讒，君子憂懼焉。」</p>
<h3>防有鵲巢</h3>
<p>防有鵲巢，邛有旨苕。誰侜予美，心焉忉忉。</p>
<p>中唐有甓，邛有旨鷊。誰侜予美，心焉惕惕。</p>
<p>《防有鵲巢》，二章，章四句。</p>
