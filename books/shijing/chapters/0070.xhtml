<h2>兔爰</h2>
<h3>國風‧王‧兔爰</h3>
<p>毛詩序：「《兔爰》，閔周也。桓王失信，諸侯背叛，構怨連禍，王師傷敗，君子不樂其生焉。」</p>
<h3>兔爰</h3>
<p>有兔爰爰，雉離于羅。我生之初，尚無為。我生之後，逢此百罹，尚寐無吪？</p>
<p>有兔爰爰，雉離于罦。我生之初，尚無造。我生之後，逢此百憂，尚寐無覺？</p>
<p>有兔爰爰，雉離于罿。我生之初，尚無庸。我生之後，逢此百凶，尚寐無聦！</p>
<p>《兔爰》，三章，章七句。</p>
