<h2>日月</h2>
<p>毛詩序：「《日月》，衞莊姜傷己也。遭州吁之難，傷己不見荅於先君，以至困窮之詩也。」</p>
<h3>日月</h3>
<p>日居月諸，照臨下土，乃如之人兮，逝不古處，胡能有定，寧不我顧。</p>
<p>日居月諸，下土是冒，乃如之人兮，逝不相好，胡能有定，寧不我報。</p>
<p>日居月諸，出自東方，乃如之人兮，德音無良，胡能有定，俾也可忘。</p>
<p>日居月諸，東方自出，父兮母兮，畜我不卒，胡能有定，報我不述。</p>
<p>《日月》，四章，章六句。</p>
