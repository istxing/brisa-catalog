<h2>黃鳥</h2>
<h3>國風‧秦‧黃鳥</h3>
<p>毛詩序：「《黃鳥》，哀三良也。國人刺穆公以人從死，而作是詩也。」</p>
<h3>黃鳥</h3>
<p>交交黃鳥，止于棘。</p>
<p>誰從穆公？子車奄息。維此奄息，百夫之特。</p>
<p>臨其穴，惴惴其慄。</p>
<p>彼蒼者天，殲我良人！如可贖兮，人百其身。</p>
<p>交交黃鳥，止于桑。</p>
<p>誰從穆公？子車仲行。維此仲行，百夫之防。</p>
<p>臨其穴，惴惴其慄。</p>
<p>彼蒼者天，殲我良人！如可贖兮，人百其身。</p>
<p>交交黃鳥，止于楚。</p>
<p>誰從穆公？子車鍼虎。維此鍼虎，百夫之禦。</p>
<p>臨其穴，惴惴其慄。</p>
<p>彼蒼者天，殲我良人！如可贖兮，人百其身。</p>
<p>《黃鳥》，三章，章十二句。</p>
