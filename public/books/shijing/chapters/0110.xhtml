<h2>陟岵</h2>
<p>毛詩序：「《陟岵》，孝子行役思念父母也。國迫而數侵削，役乎大國，父母兄弟離散，而作是詩也。」</p>
<h3>陟岵</h3>
<p>陟彼岵兮，瞻望父兮。父曰：「嗟予子！行役夙夜無已。上慎旃哉，猶來無止！」<br/>陟彼屺兮，瞻望母兮。母曰：「嗟予季！行役夙夜無寐。上慎旃哉！猶來無棄！」<br/>陟彼岡兮，瞻望兄兮。兄曰：「嗟予弟！行役夙夜必偕。上慎旃哉！猶來無死！」</p>
<p>《陟岵》，三章，章六句。</p>
