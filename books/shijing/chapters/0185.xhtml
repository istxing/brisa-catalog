<h2>車攻</h2>
<h3>小雅‧南有嘉魚之什‧車攻</h3>
<p>毛詩序：「《車攻》，宣王復古也。宣王能內脩政事，外攘夷狄，復文武之境土，脩車馬，備器械，復會諸侯于東都，因田獵而選車徒焉。」</p>
<h3>車攻</h3>
<p>我車既攻，我馬既同。四牡龐龐，駕言徂東。</p>
<p>田車既好，四牡孔阜。東有甫草，駕言行狩。</p>
<p>之子于苗，選徒嚻嚻。建旐設旄，搏獸于敖。</p>
<p>駕彼四牡，四牡奕奕。赤芾金舄，會同有繹。</p>
<p>決拾既佽，弓矢既調。射夫既同，助我舉柴。</p>
<p>四黃既駕，兩驂不猗。不失其馳，舍矢如破。</p>
<p>蕭蕭馬鳴，悠悠斾旌。徒御不驚，大庖不盈。</p>
<p>之子于征，有聞無聲。允矣君子，展也大成。</p>
<p>《車攻》，八章，章四句。</p>
