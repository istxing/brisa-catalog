<h2>狡童</h2>
<h3>國風‧鄭‧狡童</h3>
<p>毛詩序：「《狡童》，刺忽也。不能與賢人圖事，權臣擅命也。」</p>
<h3>狡童</h3>
<p>彼狡童兮，不與我言兮，維子之故，使我不能餐兮。</p>
<p>彼狡童兮，不與我食兮，維子之故，使我不能息兮。</p>
<p>《狡童》，二章，章四句。</p>
<h3>註解</h3>
<p>狡童：美貌少年。<br/>維：因爲。<br/>息：安穩入睡。</p>
