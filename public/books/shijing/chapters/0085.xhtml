<h2>蘀兮</h2>
<h3>國風‧鄭‧蘀兮</h3>
<p>毛詩序：「《蘀兮》，刺忽也。君弱臣強，不倡而和也。」</p>
<h3>蘀兮</h3>
<p>蘀兮蘀兮，風其吹女。叔兮伯兮，倡予和女。</p>
<p>蘀兮蘀兮，風其漂女。叔兮伯兮，倡予要女。</p>
<p>《蘀兮》，二章，章四句。</p>
