<h2>匪風</h2>
<h3>國風‧檜‧匪風</h3>
<p>毛詩序：「《匪風》，思周道也。國小政亂，憂及禍難而思周道焉。」</p>
<h3>匪風</h3>
<p>匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。</p>
<p>匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。</p>
<p>誰能亨魚，溉之釜鬵。誰將西歸，懷之好音。</p>
<p>《匪風》，三章，章四句。</p>
