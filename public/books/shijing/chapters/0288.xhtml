<h2>雝</h2>
<h3>周頌‧臣工之什‧雝</h3>
<p>毛詩序：「《雝》，禘大祖也。」</p>
<h3>雝</h3>
<p>有來雝雝，至止肅肅。相維辟公，天子穆穆。於薦廣牡，相予肆祀。</p>
<p>假哉皇考，綏予孝子。宣哲維人，文武維后。燕及皇天，克昌厥後。</p>
<p>綏我眉壽，介以繁祉。既右烈考，亦右文母。</p>
<p>《雝》，一章，十六句。</p>
