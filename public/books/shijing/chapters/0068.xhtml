<h2>揚之水</h2>
<h3>國風‧王‧揚之水</h3>
<p>毛詩序：「《揚之水》，刺平王也。不撫其民，而遠屯戍于母家，周人怨思焉。」</p>
<h3>王‧揚之水</h3>
<p>揚之水，不流束薪。彼其之子，不與我戍申。懷哉懷哉！曷月予還歸哉！</p>
<p>揚之水，不流束楚。彼其之子，不與我戍甫。懷哉懷哉！曷月予還歸哉！</p>
<p>揚之水，不流束蒲。彼其之子，不與我戍許。懷哉懷哉！曷月予還歸哉！</p>
<p>《揚之水》，三章，章六句。</p>
