<h2>君子陽陽</h2>
<h3>國風‧王‧君子陽陽</h3>
<p>毛詩序：「《君子陽陽》，閔周也。君子遭亂，相招為祿仕，全身遠害而已。」</p>
<h3>君子陽陽</h3>
<p>君子陽陽，左執簧，右招我由房。其樂只且。<br/>君子陶陶，左執翿，右招我由敖。其樂只且。</p>
<p>《君子陽陽》，二章，章四句。</p>
