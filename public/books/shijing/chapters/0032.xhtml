<h2>凱風</h2>
<p>毛詩序：「《凱風》，美孝子也。衞之淫風流行，雖有七子之母，猶不能安其室，故美七子能盡其孝道，以慰其母心，而成其志爾。」</p>
<h3>凱風</h3>
<p>凱風自南，吹彼棘心；</p>
<p>棘心夭夭，母氏劬勞。</p>
<p>凱風自南，吹彼棘薪；</p>
<p>母氏聖善，我無令人。</p>
<p>爰有寒泉，在浚之下；</p>
<p>有子七人，母氏勞苦。</p>
<p>睍睆黃鳥，載好其音；</p>
<p>有子七人，莫慰母心。</p>
<p>《凱風》，四章，章四句。</p>
