<h2>蹇</h2>
<p>周易　第三十九卦</p>
<p>蹇</p>
<p>艮下坎上</p>
<p>易經：</p>
<p>蹇：利西南，不利東北；利見大人，貞吉。</p>
<p>初六：往蹇，來譽。</p>
<p>六二：王臣蹇蹇，匪躬之故。</p>
<p>九三：往蹇來反。</p>
<p>六四：往蹇來連。</p>
<p>九五：大蹇朋來。</p>
<p>上六：往蹇來碩，吉；利見大人。</p>
<p>彖曰：</p>
<p>蹇，難也，險在前也。見險而能止，知矣哉！蹇利西南，往得中也；不利東北，其道窮也。利見大人，往有功也。當位貞吉，以正邦也。蹇之時用大矣哉！</p>
<p>象曰：</p>
<p>山上有水，蹇；君子以反身修德。</p>
<p>往蹇來譽，宜待也。</p>
<p>王臣蹇蹇，終无尤也。</p>
<p>往蹇來反，內喜之也。</p>
<p>往蹇來連，當位實也。</p>
<p>大蹇朋來，以中節也。</p>
<p>往蹇來碩，志在內也。利見大人，以從貴也。</p>
</section></body>
