<h2>有杕之杜</h2>
<h3>國風‧唐‧有杕之杜</h3>
<p>毛詩序：「《有杕之杜》，刺晉武也。武公寡特，兼其宗族，而不求賢以自輔焉。」</p>
<h3>有杕之杜</h3>
<p>有杕之杜，生于道左。彼君子兮，噬肯適我。中心好之，曷飲食之。</p>
<p>有杕之杜，生于道周。彼君子兮，噬肯來遊。中心好之，曷飲食之。</p>
<p>《有杕之杜》，二章，章六句。</p>
