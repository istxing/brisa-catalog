<h2>昊天有成命</h2>
<h3>周頌‧清廟之什‧昊天有成命</h3>
<p>毛詩序：「《昊天有成命》，郊祀天地也。」</p>
<h3>昊天有成命</h3>
<p>昊天有成命，二后受之。</p>
<p>成王不敢康，夙夜基命宥密。</p>
<p>於緝熙！單厥心。肆其靖之。</p>
<p>《昊天有成命》，一章，七句。</p>
