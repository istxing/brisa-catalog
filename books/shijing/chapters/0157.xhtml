<h2>破斧</h2>
<h3>國風‧豳‧破斧</h3>
<p>毛詩序：「《破斧》，美周公也。周大夫以惡四國焉。」</p>
<h3>破斧</h3>
<p>既破我斧，又缺我斨。周公東征，四國是皇。哀我人斯，亦孔之將。</p>
<p>既破我斧，又缺我錡。周公東征，四國是吪。哀我人斯，亦孔之嘉。</p>
<p>既破我斧，又缺我銶。周公東征，四國是遒。哀我人斯，亦孔之休。</p>
<p>《破斧》，三章，章六句。</p>
