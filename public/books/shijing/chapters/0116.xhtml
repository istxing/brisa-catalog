<h2>揚之水</h2>
<h3>國風‧唐‧揚之水</h3>
<p>毛詩序：「《揚之水》，刺晉昭公也。昭公分國以封沃，沃盛強，昭公微弱，國人將叛而歸沃焉。」</p>
<h3>唐‧揚之水</h3>
<p>揚之水，白石鑿鑿，素衣朱襮，從子于沃，既見君子，云何不樂。</p>
<p>揚之水，白石皓皓，素衣朱繡，從子于鵠，既見君子，云何其憂。</p>
<p>揚之水，白石粼粼，我聞有命，不敢以告人！</p>
<p>《揚之水》，三章：二章，章六句，一章四句。</p>
