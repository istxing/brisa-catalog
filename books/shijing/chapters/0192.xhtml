<h2>白駒</h2>
<h3>小雅‧鴻鴈之什‧白駒</h3>
<p>毛詩序：「《白駒》，大夫刺宣王也。」</p>
<h3>白駒</h3>
<p>皎皎白駒，食我場苗。縶之維之，以永今朝。所謂伊人，於焉逍遙。</p>
<p>皎皎白駒，食我場藿。縶之維之，以永今夕。所謂伊人，於焉嘉客。</p>
<p>皎皎白駒，賁然來思。爾公爾侯，逸豫無期。慎爾優游，勉爾遁思。</p>
<p>皎皎白駒，在彼空谷，生芻一束。其人如玉，毋金玉爾音，而有遐心。</p>
<p>《白駒》，四章，章六句。</p>
