<h2>羔裘</h2>
<h3>國風‧鄭‧羔裘</h3>
<p>毛詩序：「《羔裘》，刺朝也。言古之君子，以風其朝焉。」</p>
<h3>國風‧鄭‧羔裘</h3>
<p>羔裘如濡，洵直且侯。彼其之子，舍命不渝。</p>
<p>羔裘豹飾，孔武有力。彼其之子，邦之司直。</p>
<p>羔裘晏兮，三英粲兮。彼其之子，邦之彥兮。</p>
<p>《羔裘》，三章，章四句。</p>
