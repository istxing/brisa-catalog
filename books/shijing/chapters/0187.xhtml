<h2>鴻鴈</h2>
<h3>小雅‧鴻鴈之什‧鴻鴈</h3>
<p>毛詩序：「《鴻鴈》，美宣王也。萬民離散，不安其居，而能勞來還定，安集之，至于矜寡，無不得其所焉。」</p>
<h3>鴻鴈</h3>
<p>鴻鴈于飛，肅肅其羽。之子于征，劬勞于野。爰及矜人，哀此鰥寡。</p>
<p>鴻鴈于飛，集于中澤。之子于垣，百堵皆作。雖則劬勞，其究安宅。</p>
<p>鴻鴈于飛，哀鳴嗸嗸。維此哲人，謂我劬勞。維彼愚人，謂我宣驕。</p>
<p>《鴻鴈》，三章，章六句。</p>
