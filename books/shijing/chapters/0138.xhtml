<h2>衡門</h2>
<h3>國風‧陳‧衡門</h3>
<p>毛詩序：「《衡門》，誘僖公也。愿而無立志，故作是詩以誘掖其君也。」</p>
<h3>衡門</h3>
<p>衡門之下，可以棲遲。泌之洋洋，可以樂飢。</p>
<p>豈其食魚，必河之魴。豈其取妻，必齊之姜。</p>
<p>豈其食魚，必河之鯉。豈其取妻，必宋之子。</p>
<p>《衡門》，三章，章四句。</p>
