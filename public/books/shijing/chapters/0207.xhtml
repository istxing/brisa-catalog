<h2>谷風</h2>
<h3>小雅‧谷風之什‧谷風</h3>
<p>毛詩序：「《谷風》，刺幽王也。天下俗薄，朋友道絕焉。」</p>
<h3>谷風</h3>
<p>習習谷風，維風及雨。</p>
<p>將恐將懼，維予與女。</p>
<p>將安將樂，女轉棄予。</p>
<p>習習谷風，維風及頹。</p>
<p>將恐將懼，寘予于懷。</p>
<p>將安將樂，棄予如遺。</p>
<p>習習谷風，維山崔嵬。</p>
<p>無草不死，無木不萎。</p>
<p>忘我大德，思我小怨。</p>
<p>《谷風》，三章，章六句。</p>
