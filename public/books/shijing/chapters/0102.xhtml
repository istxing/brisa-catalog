<h2>甫田</h2>
<h3>國風‧齊‧甫田</h3>
<p>毛詩序：「《甫田》，大夫刺襄公也。無禮義而求大功，不脩德而求諸侯，志大心勞，所以求者非其道也。」</p>
<h3>甫田</h3>
<p>無田甫田，維莠驕驕。無思遠人，勞心忉忉。</p>
<p>無田甫田，維莠桀桀。無思遠人，勞心怛怛。</p>
<p>婉兮孌兮，緫角丱兮。未幾見兮，突而弁兮。</p>
<p>《甫田》，三章，章四句。</p>
