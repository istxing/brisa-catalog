<h2>大車</h2>
<h3>國風‧王‧大車</h3>
<p>毛詩序：「《大車》，刺周大夫也。禮義陵遲，男女淫奔，故陳古以刺今，大夫不能聽男女之訟焉。」</p>
<h3>大車</h3>
<p>大車檻檻，毳衣如菼。豈不爾思，畏子不敢。</p>
<p>大車啍啍，毳衣如璊。豈不爾思，畏子不奔。</p>
<p>穀則異室，死則同穴。謂予不信，有如皦日。</p>
<p>《大車》，三章，章四句。</p>
