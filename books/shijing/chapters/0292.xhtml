<h2>閔予小子</h2>
<h3>周頌‧閔予小子之什‧閔予小子</h3>
<p>毛詩序：「《閔予小子》，嗣王朝於廟也。」</p>
<h3>閔予小子</h3>
<p>閔予小子，遭家不造，嬛嬛在疚。</p>
<p>於乎皇考，永世克孝，念茲皇祖，陟降庭止。</p>
<p>維予小子，夙夜敬止。</p>
<p>於乎皇王，繼序思不忘。</p>
<p>《閔予小子》，一章，十一句。</p>
