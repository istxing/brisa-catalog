<h2>子衿</h2>
<h3>國風‧鄭‧子衿</h3>
<p>毛詩序：「《子衿》，刺學校廢也。亂世則學校不脩焉。」</p>
<p>青青子衿，悠悠我心。縱我不往，子寧不嗣音。</p>
<p>青青子佩，悠悠我思。縱我不往，子寧不來。</p>
<p>挑兮達兮，在城闕兮。一日不見，如三月兮。</p>
<p>《子衿》，三章，章四句。</p>
