<h2>東方未明</h2>
<h3>國風‧齊‧東方未明</h3>
<p>毛詩序：「《東方未明》，刺無節也。朝廷興居無節，號令不時，挈壺氏不能掌其職焉。」</p>
<h3>東方未明</h3>
<p>東方未明，顛倒衣裳。顛之倒之，自公召之。</p>
<p>東方未晞，顛倒裳衣。倒之顛之，自公令之。</p>
<p>折柳樊圃，狂夫瞿瞿。不能辰夜，不夙則莫。</p>
<p>《東方未明》，三章，章四句。</p>
