<h2>豐年</h2>
<h3>周頌‧臣工之什‧豐年</h3>
<p>毛詩序：「《豐年》，秋冬報也。」</p>
<h3>豐年</h3>
<p>豐年多黍多稌，亦有高廩，萬億及秭。</p>
<p>為酒為醴，烝畀祖妣，以洽百禮，降福孔皆。</p>
<p>《豐年》，一章，七句。</p>
