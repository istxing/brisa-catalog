<h2>羔裘</h2>
<h3>國風‧檜‧羔裘</h3>
<p>毛詩序：「《羔裘》，大夫以道去其君也。國小而迫，君不用道，好絜其衣服，逍遙遊燕，而不能自強於政治。故作是詩也。」</p>
<h3>國風‧檜‧羔裘</h3>
<p>羔裘逍遙，狐裘以朝。豈不爾思，勞心忉忉。</p>
<p>羔裘翱翔，狐裘在堂。豈不爾思，我心憂傷。</p>
<p>羔裘如膏，日出有曜。豈不爾思，中心是悼。</p>
<p>《羔裘》，三章，章四句。</p>
