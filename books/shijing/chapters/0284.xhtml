<h2>振鷺</h2>
<h3>周頌‧臣工之什‧振鷺</h3>
<p>毛詩序：「《振鷺》，二王之後，來助祭也。」</p>
<h3>振鷺</h3>
<p>振鷺于飛，于彼西雝。我客戾止，亦有斯容。</p>
<p>在彼無惡，在此無斁。庶幾夙夜，以永終譽。</p>
<p>《振鷺》，一章，八句。</p>
