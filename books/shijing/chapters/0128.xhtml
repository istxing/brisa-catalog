<h2>小戎</h2>
<h3>國風‧秦‧小戎</h3>
<p>毛詩序：「《小戎》，美襄公也。備其兵甲，以討西戎。西戎方彊，而征伐不休，國人則矜其車甲，婦人能閔其君子焉。」</p>
<h3>小戎</h3>
<p>小戎俴收，五楘梁輈，游環脅驅，陰靷鋈續，文茵暢轂，駕我騏馵。言念君子，溫其如玉。在其板屋，亂我心曲。</p>
<p>四牡孔阜，六轡在手，騏駵是中，騧驪是驂，龍盾之合，鋈以觼軜。言念君子，溫其在邑。方何為期，胡然我念之。</p>
<p>俴駟孔羣，厹矛鋈錞，蒙伐有苑，虎韔鏤膺，交韔二弓，竹閉緄縢。言念君子，載寢載興。厭厭良人，秩秩德音。</p>
<p>《小戎》，三章，章十句。</p>
