<h2>瞻彼洛矣</h2>
<h3>小雅‧甫田之什‧瞻彼洛矣</h3>
<p>毛詩序：「《瞻彼洛矣》，刺幽王也。思古明王，能爵命諸侯，賞善罰惡焉。」</p>
<h3>瞻彼洛矣</h3>
<p>瞻彼洛矣，維水泱泱。君子至止，福祿如茨。韎韐有奭，以作六師。</p>
<p>瞻彼洛矣，維水泱泱。君子至止，鞸琫有珌。君子萬年，保其家室。</p>
<p>瞻彼洛矣，維水泱泱。君子至止，福祿既同。君子萬年，保其家邦。</p>
<p>《瞻彼洛矣》，三章，章六句。</p>
