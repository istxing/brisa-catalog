<h2>泉水</h2>
<h3>國風‧邶‧泉水</h3>
<p>毛詩序：「《泉水》，衞女思歸也。嫁於諸侯，父母終，思歸寧而不得，故作是詩以自見也。」</p>
<h3>泉水</h3>
<p>毖彼泉水，亦流于淇，有懷于衞，靡日不思，孌彼諸姬，聊與之謀。</p>
<p>出宿于泲，飲餞于禰，女子有行，遠父母兄弟，問我諸姑，遂及伯姊。</p>
<p>出宿于干，飲餞于言，載脂載舝，還車言邁，遄臻于衞，不瑕有害。</p>
<p>我思肥泉，茲之永歎，思須與漕，我心悠悠，駕言出遊，以寫我憂。</p>
<p>《泉水》，四章，章六句。</p>
