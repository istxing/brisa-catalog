<h2>載芟</h2>
<h3>周頌‧閔予小子之什‧載芟</h3>
<p>毛詩序：「《載芟》，春籍田而祈社稷也。」</p>
<h3>載芟</h3>
<p>載芟載柞，其耕澤澤。千耦其耘，徂隰徂畛。</p>
<p>侯主侯伯，侯亞侯旅，侯彊侯以。</p>
<p>有嗿其饁，思媚其婦，有依其士。</p>
<p>有略其耜，俶載南畝，播厥百穀，實函斯活。</p>
<p>驛驛其達，有厭其傑。厭厭其苗，緜緜其麃。</p>
<p>載穫濟濟，有實其積，萬億及秭。</p>
<p>為酒為醴，烝畀祖妣，以洽百禮，有飶其香，邦家之光。</p>
<p>有椒其馨，胡考之寧。匪且有且，匪今斯今，振古如茲。</p>
<p>《載芟》，一章，三十一句。</p>
