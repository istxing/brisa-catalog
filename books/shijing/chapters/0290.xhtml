<h2>有客</h2>
<h3>周頌‧臣工之什‧有客</h3>
<p>毛詩序：「《有客》，微子來見祖廟也。」</p>
<h3>有客</h3>
<p>有客有客，亦白其馬。有萋有且，敦琢其旅。</p>
<p>有客宿宿，有客信信。言授之縶，以縶其馬。</p>
<p>薄言追之，左右綏之。既有淫威，降福孔夷。</p>
<p>《有客》，一章，十二句。</p>
