<h2>終風</h2>
<p>毛詩序：「《終風》，衞莊姜傷己也。遭州吁之暴，見侮慢而不能正也。」</p>
<h3>終風</h3>
<p>終風且暴，顧我則笑，謔浪笑敖，中心是悼。</p>
<p>終風且霾，惠然肯來，莫往莫來，悠悠我思。</p>
<p>終風且曀，不日有曀，寤言不寐，願言則嚏。</p>
<p>曀曀其陰，虺虺其靁，寤言不寐，願言則懷。</p>
<p>《終風》，四章，章四句。</p>
