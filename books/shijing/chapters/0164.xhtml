<h2>常棣</h2>
<h3>小雅‧鹿鳴之什‧常棣</h3>
<p>毛詩序：「《常棣》，燕兄弟也。閔管蔡之失道，故作常棣焉。」</p>
<h3>常棣</h3>
<p>常棣之華，鄂不韡韡。凡今之人，莫如兄弟。</p>
<p>死喪之威，兄弟孔懷。原隰裒矣，兄弟求矣。</p>
<p>脊令在原，兄弟急難。每有良朋，況也永歎。</p>
<p>兄弟鬩于牆，外禦其務。每有良朋，烝也無戎。</p>
<p>喪亂既平，既安且寧。雖有兄弟，不如友生。</p>
<p>儐爾籩豆，飲酒之飫。兄弟既具，和樂且孺。</p>
<p>妻子好合，如鼓瑟琴。兄弟既翕，和樂且湛。</p>
<p>宜爾室家，樂爾妻帑。是究是圖，亶其然乎。</p>
<p>《常棣》，八章，章四句。</p>
