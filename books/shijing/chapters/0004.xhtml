<h2>樛木</h2>
<h3>國風‧周南‧樛木</h3>
<h3>毛詩序</h3>
<p>《樛木》，后妃逮下也，言能逮下而無嫉妒之心焉。</p>
<h3>詩文</h3>
<p>南有樛木，葛藟纍之，樂只君子，福履綏之。<br/>南有樛木，葛藟荒之，樂只君子，福履將之。<br/>南有樛木，葛藟縈之，樂只君子，福履成之。</p>
<p>《樛木》，三章，章四句</p>
<h3>註解</h3>
<p>「樛（音究，粵音溝）」：向下彎曲的樹木</p>
<p>「葛藟（音磊，粵音侶）」：籐蔓</p>
<p>「纍（音雷，粵音雷）」：纏繞</p>
<p>「樂」：快樂</p>
<p>「只」：助詞</p>
<p>「福履」：福祿。履，祿</p>
<p>「绥（音雖，粵音雖）」：安撫</p>
<p>「荒」：覆蓋</p>
<p>「將」：扶持</p>
<p>「縈」：纏繞</p>
<p>「成」：成全</p>
