<h2>采綠</h2>
<h3>小雅‧魚藻之什‧采綠</h3>
<p>毛詩序：「《采綠》，刺怨曠也。幽王之時，多怨曠者也。」</p>
<h3>采綠</h3>
<p>終朝采綠，不盈一匊。予髮曲局，薄言歸沐。</p>
<p>終朝采藍，不盈一襜。五日為期，六日不詹。</p>
<p>之子于狩，言韔其弓。之子于釣，言綸之繩。</p>
<p>其釣維何？維魴及鱮。維魴及鱮，薄言觀者。</p>
<p>《采綠》，四章，章四句。</p>
