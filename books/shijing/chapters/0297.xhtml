<h2>良耜</h2>
<h3>周頌‧閔予小子之什‧良耜</h3>
<p>毛詩序：「《良耜》，秋報社稷也。」</p>
<h3>良耜</h3>
<p>畟畟良耜，俶載南畝，播厥百穀，實函斯活。</p>
<p>或來瞻女，載筐及筥。其饟伊黍，其笠伊糾。</p>
<p>其鎛斯趙，以薅荼蓼，荼蓼朽止，黍稷茂止。</p>
<p>穫之挃挃，積之栗栗，其崇如墉，其比如櫛，以開百室。</p>
<p>百室盈止，婦子寧止。殺時犉牡，有捄其角。</p>
<p>以似以續，續古之人。</p>
<p>《良耜》，一章，二十三句。</p>
