<h2>信南山</h2>
<h3>小雅‧谷風之什‧信南山</h3>
<p>毛詩序：「《信南山》，刺幽王也。不能脩成王之業，疆理天下，以奉禹功，故君子思古焉。」</p>
<h3>信南山</h3>
<p>信彼南山，維禹甸之。畇畇原隰，曾孫田之。我疆我理，南東其畝。</p>
<p>上天同雲，雨雪雰雰。益之以霢霂，既優既渥。既霑既足，生我百穀。</p>
<p>疆埸翼翼，黍稷彧彧。曾孫之穡，以為酒食。畀我尸賓，壽考萬年。</p>
<p>中田有廬，疆埸有瓜。是剝是菹，獻之皇祖。曾孫壽考，受天之祜。</p>
<p>祭以清酒，從以騂牡，享于祖考。執其鸞刀，以啟其毛，取其血膋。</p>
<p>是烝是享，苾苾芬芬。祀事孔明，先祖是皇。報以介福，萬壽無疆。</p>
<p>《信南山》，六章，章六句。</p>
