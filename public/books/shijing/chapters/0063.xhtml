<h2>有狐</h2>
<h3>國風‧衞‧有狐</h3>
<p>毛詩序：「《有狐》，刺時也。衞之男女失時，喪其妃耦焉，古者國有凶荒，則殺禮而多昏，會男女之無夫家者，所以育人民也。」</p>
<h3>有狐</h3>
<p>有狐綏綏，在彼淇梁，心之憂矣，之子無裳。</p>
<p>有狐綏綏，在彼淇厲，心之憂矣，之子無帶。</p>
<p>有狐綏綏，在彼淇側，心之憂矣，之子無服。</p>
<p>《有狐》，三章，章四句。</p>
