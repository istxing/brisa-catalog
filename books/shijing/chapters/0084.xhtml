<h2>山有扶蘇</h2>
<h3>國風‧鄭‧山有扶蘇</h3>
<p>毛詩序：「《山有扶蘇》，刺忽也。所美非美然。」</p>
<h3>山有扶蘇</h3>
<p>山有扶蘇，隰有荷華。不見子都，乃見狂且。</p>
<p>山有橋松，隰有游龍。不見子充，乃見狡童。</p>
<p>《山有扶蘇》，二章，章四句。</p>
