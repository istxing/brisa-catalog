<h2>螽斯</h2>
<h3>國風‧周南‧螽斯</h3>
<h3>毛詩序</h3>
<p>《螽斯》，后妃子孫衆多也。言若螽斯，不妬忌，則子孫衆多也。</p>
<h3>詩文</h3>
<p>螽斯羽，詵詵兮，宜爾子孫，振振兮！<br/>螽斯羽，薨薨兮，宜爾子孫，繩繩兮！<br/>螽斯羽，揖揖兮，宜爾子孫，蟄蟄兮！</p>
<p><small>《螽斯》，三章，章四句。</small></p>
<h3>註解</h3>
<p>「螽」：音鈡，一種直翅目昆蟲</p>
<p>「詵」：音身，同莘莘，衆多的樣子</p>
<p>「宜」：多</p>
<p>「振振」：音真，品德仁厚的樣子</p>
<p>「薨」：音轟，成群的昆蟲一起飛的樣子</p>
<p>「繩繩」：謹慎、認真，韓詩：敬貌、戒也，毛詩：戒慎</p>
<p>「揖揖」：同集，會聚</p>
<p>「蟄蟄」：音執，衆多的樣子</p>
