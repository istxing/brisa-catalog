<h2>潛</h2>
<h3>周頌‧臣工之什‧潛</h3>
<p>毛詩序：「潛，季冬薦魚，春獻鮪也。」</p>
<h3>潛</h3>
<p>猗與漆沮，潛有多魚。</p>
<p>有鱣有鮪，鰷鱨鰋鯉。</p>
<p>以享以祀，以介景福。</p>
<p>《潛》，一章，六句。</p>
