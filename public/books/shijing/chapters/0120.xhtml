<h2>羔裘</h2>
<h3>國風‧唐‧羔裘</h3>
<p>毛詩序：「《羔裘》，刺時也。晉人刺其在位，不恤其民也。」</p>
<h3>國風‧唐‧羔裘</h3>
<p>羔裘豹袪，自我人居居。豈無他人？維子之故。</p>
<p>羔裘豹褎，自我人究究。豈無他人？維子之好。</p>
<p>《羔裘》，二章，章四句。</p>
