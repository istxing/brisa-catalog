<h2>載驅</h2>
<h3>國風‧齊‧載驅</h3>
<p>載驅薄薄，簟茀朱鞹。魯道有蕩，齊子發夕。</p>
<p>四驪濟濟，垂轡濔濔。魯道有蕩，齊子豈弟。</p>
<p>汶水湯湯，行人彭彭。魯道有蕩，齊子翱翔。</p>
<p>汶水滔滔，行人儦儦。魯道有蕩，齊子遊敖。</p>
<p>《載驅》，四章，章四句。</p>
