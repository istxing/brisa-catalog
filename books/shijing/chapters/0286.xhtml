<h2>有瞽</h2>
<h3>周頌‧臣工之什‧有瞽</h3>
<p>毛詩序：「《有瞽》，始作樂而合乎祖也。」</p>
<h3>有瞽</h3>
<p>有瞽有瞽，在周之庭。設業設虡，崇牙樹羽。應田縣鼓，鞉磬柷圉。</p>
<p>既備乃奏，簫管備舉。喤喤厥聲，肅雝和鳴，先祖是聽。</p>
<p>我客戾止，永觀厥成。</p>
<p>《有瞽》，一章，十三句。</p>
