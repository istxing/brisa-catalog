<h2>思齊</h2>
<h3>大雅‧文王之什‧思齊</h3>
<p>毛詩序：「《思齊》，文王所以聖也。」</p>
<h3>思齊</h3>
<p>思齊大任，文王之母，思媚周姜。京室之婦，大姒嗣徽音，則百斯男。</p>
<p>惠于宗公，神罔時怨，神罔時恫。刑于寡妻，至于兄弟，以御于家邦。</p>
<p>雝雝在宮，肅肅在廟。不顯亦臨，無射亦保。</p>
<p>肆戎疾不殄，烈假不遐。不聞亦式，不諫亦入。</p>
<p>肆成人有德，小子有造。古之人無斁，譽髦斯士。</p>
<p>《思齊》，四章：章六句。故言五章：二章，章六句；三章，章四句。</p>
