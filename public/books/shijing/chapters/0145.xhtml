<h2>澤陂</h2>
<h3>國風‧陳‧澤陂</h3>
<p>毛詩序：「《澤陂》，刺時也。言靈公君臣淫於其國，男女相說，憂思感傷焉。」</p>
<h3>澤陂</h3>
<p>彼澤之陂，有蒲與荷。有美一人，傷如之何。寤寐無為，涕泗滂沱。</p>
<p>彼澤之陂，有蒲與蕑。有美一人，碩大且卷。寤寐無為，中心悁悁。</p>
<p>彼澤之陂，有蒲菡萏。有美一人，碩大且儼。寤寐無為，輾轉伏枕。</p>
<p>《澤陂》，三章，章六句。</p>
