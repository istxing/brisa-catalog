<h2>賚</h2>
<h3>周頌‧閔予小子之什‧賚</h3>
<p>毛詩序：「《賚》，大封於廟也。賚，予也。言所以錫予善人也。」</p>
<h3>賚</h3>
<p>文王既勤止，我應受之。敷時繹思，我徂維求定。</p>
<p>時周之命，於繹思。</p>
<p>《賚》，一章，六句。</p>
