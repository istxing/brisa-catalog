<h2>棫樸</h2>
<h3>大雅‧文王之什‧棫樸</h3>
<p>毛詩序：「《棫樸》，文王能官人也。」</p>
<h3>棫樸</h3>
<p>芃芃棫樸，薪之槱之。濟濟辟王，左右趣之。</p>
<p>濟濟辟王，左右奉璋。奉璋峨峨，髦士攸宜。</p>
<p>淠彼涇舟，烝徒楫之。周王于邁，六師及之。</p>
<p>倬彼雲漢，為章于天。周王壽考，遐不作人。</p>
<p>追琢其章，金玉其相。勉勉我王，綱紀四方。</p>
<p>《棫樸》，五章，章四句。</p>
