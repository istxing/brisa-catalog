<h2>彤弓</h2>
<h3>小雅‧南有嘉魚之什‧彤弓</h3>
<p>毛詩序：「《彤弓》，天子錫有功諸侯也。」</p>
<h3>彤弓</h3>
<p>彤弓弨兮，受言藏之。我有嘉賓，中心貺之。鐘鼓既設，一朝饗之。</p>
<p>彤弓弨兮，受言載之。我有嘉賓，中心喜之。鐘鼓既設，一朝右之。</p>
<p>彤弓弨兮，受言櫜之。我有嘉賓，中心好之。鐘鼓既設，一朝醻之。</p>
<p>《彤弓》，三章，章六句。</p>
