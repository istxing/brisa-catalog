<h2>新臺</h2>
<h3>國風‧邶‧新臺</h3>
<p>毛詩序：「《新臺》，刺衞宣公也，納伋之妻，作新臺于河上而要之。國人惡之，而作是詩也。」</p>
<h3>新臺</h3>
<p>新臺有泚，河水瀰瀰，燕婉之求，蘧篨不鮮。</p>
<p>新臺有洒，河水浼浼，燕婉之求，蘧篨不殄。</p>
<p>魚網之設，鴻則離之，燕婉之求，得此戚施。</p>
<p>《新臺》，三章，章四句。</p>
