<h2>伐木</h2>
<h3>小雅‧鹿鳴之什‧伐木</h3>
<p>毛詩序：「《伐木》，燕朋友故舊也。自天子至于庶人，未有不須友以成者。親親以睦，友賢不棄，不遺故舊，則民德歸厚矣。」</p>
<h3>伐木</h3>
<p>伐木丁丁，鳥鳴嚶嚶。出自幽谷，遷于喬木。嚶其鳴矣，求其友聲。</p>
<p>相彼鳥矣，猶求友聲。矧伊人矣，不求友生。神之聽之，終和且平。</p>
<p>伐木許許，釃酒有藇。既有肥羜，以速諸父。寧適不來？微我弗顧。</p>
<p>於粲洒埽，陳饋八簋。既有肥牡，以速諸舅。寧適不來？微我有咎。</p>
<p>伐木于阪，釃酒有衍，籩豆有踐，兄弟無遠。民之失德，乾餱以愆。</p>
<p>有酒湑我，無酒酤我。坎坎鼓我，蹲蹲舞我。迨我暇矣！飲此湑矣！</p>
<p>《伐木》，六章，章六句。</p>
