<h2>株林</h2>
<h3>國風‧陳‧株林</h3>
<p>毛詩序：「《株林》，刺靈公也。淫乎夏姬，驅馳而往，朝夕不休息焉。」</p>
<h3>株林</h3>
<p>胡為乎株林？從夏南。匪適株林，從夏南。</p>
<p>駕我乘馬，說于株野。乘我乘駒，朝食于株。</p>
<p>《株林》，二章，章四句。</p>
