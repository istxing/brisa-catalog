<h2>定之方中</h2>
<h3>國風‧鄘‧定之方中</h3>
<p>毛詩序：「《定之方中》，美衞文公也。衞為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。」</p>
<h3>定之方中</h3>
<p>定之方中，作于楚宮，揆之以日，作于楚室，樹之榛栗，椅桐梓漆，爰伐琴瑟。</p>
<p>升彼虛矣，以望楚矣，望楚與堂，景山與京，降觀于桑，卜云其吉，終然允臧。</p>
<p>靈雨既零，命彼倌人，星言夙駕，說于桑田，匪直也人，秉心塞淵，騋牝三千。</p>
<p>《定之方中》，三章，章七句。</p>
