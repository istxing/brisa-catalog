<h2>天作</h2>
<h3>周頌‧清廟之什‧天作</h3>
<p>毛詩序：「《天作》，祀先王先公也。」</p>
<h3>天作</h3>
<p>天作高山，大王荒之。</p>
<p>彼作矣，文王康之。</p>
<p>彼徂矣，岐有夷之行。</p>
<p>子孫保之。</p>
<p>《天作》，一章，七句。</p>
