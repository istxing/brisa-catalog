<h2>權輿</h2>
<h3>國風‧秦‧權輿</h3>
<p>毛詩序：「《權輿》，刺康公也。忘先君之舊臣與賢者，有始而無終也。」</p>
<h3>權輿</h3>
<p>於我乎，夏屋渠渠，今也每食無餘。于嗟乎！不承權輿。</p>
<p>於我乎，每食四簋，今也每食不飽。于嗟乎！不承權輿。</p>
<p>《權輿》，二章，章五句。</p>
