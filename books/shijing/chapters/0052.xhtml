<h2>相鼠</h2>
<h3>國風‧鄘‧相鼠</h3>
<p>毛詩序：「《相鼠》，刺無禮也。衞文公能正其羣臣而刺在位，承先君之化，無禮儀也。」</p>
<h3>相鼠</h3>
<p>相鼠有皮，人而無儀，人而無儀，不死何為。</p>
<p>相鼠有齒，人而無止，人而無止，不死何俟。</p>
<p>相鼠有體，人而無禮，人而無禮，胡不遄死。</p>
<p>《相鼠》，三章，章四句。</p>
