<h2>節</h2>
<p>周易　第六十卦</p>
<p>節</p>
<p>兌下坎上</p>
<p>易經：</p>
<p>節：亨。苦節不可貞。</p>
<p>初九：不出戶庭，无咎。</p>
<p>九二：不出門庭，凶。</p>
<p>六三：不節若，則嗟若，无咎。</p>
<p>六四：安節，亨。</p>
<p>九五：甘節，吉；往有尚。</p>
<p>上六：苦節，貞凶，悔亡。</p>
<p>彖曰：</p>
<p>節，亨，剛柔分，而剛得中。苦節不可貞，其道窮也。說以行險，當位以節，中正以通。天地節而四時成，節以制度，不傷財，不害民。</p>
<p>象曰：</p>
<p>澤上有水，節；君子以制數度，議德行。</p>
<p>不出戶庭，知通塞也。</p>
<p>不出門庭，失時極也。</p>
<p>不節之嗟，又誰咎也。</p>
<p>安節之亨，承上道也。</p>
<p>甘節之吉，居位中也。</p>
<p>苦節貞凶，其道窮也。</p>
</section></body>
