<h2>葛屨</h2>
<h3>國風‧魏‧葛屨</h3>
<p>毛詩序：「《葛屨》，刺褊也。魏地陿隘，其民機巧趨利。其君儉嗇褊急，而無德以將之。」</p>
<h3>葛屨</h3>
<p>糾糾葛屨，可以履霜。摻摻女手，可以縫裳。要之襋之，好人服之。</p>
<p>好人提提，宛然左辟。佩其象揥。維是褊心，是以為刺。</p>
<p>《葛屨》二章：一章六句，一章五句。</p>
