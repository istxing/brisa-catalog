<h2>著</h2>
<h3>國風‧齊‧著</h3>
<p>毛詩序：「《著》，刺時也。時不親迎也。」</p>
<h3>著</h3>
<p>俟我於著乎而，充耳以素乎而，尚之以瓊華乎而。</p>
<p>俟我於庭乎而，充耳以青乎而，尚之以瓊瑩乎而。</p>
<p>俟我於堂乎而，充耳以黃乎而，尚之以瓊英乎而。</p>
<p>《著》，三章，章三句。</p>
