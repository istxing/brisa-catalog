<h2>東方之日</h2>
<h3>國風‧齊‧東方之日</h3>
<p>毛詩序：「《東方之日》，刺衰也。君臣失道，男女淫奔，不能以禮化也。」</p>
<h3>東方之日</h3>
<p>東方之日兮，彼姝者子，在我室兮，在我室兮，履我即兮。</p>
<p>東方之月兮，彼姝者子，在我闥兮，在我闥兮，履我發兮。</p>
<p>《東方之日》，二章，章五句。</p>
