<h2>載馳</h2>
<h3>國風‧鄘‧載馳</h3>
<p>毛詩序：「《載馳》，許穆夫人作也。閔其宗國顛覆，自傷不能救也，衞懿公為狄人所滅，國人分散，露於漕邑，許穆夫人閔衞之亡，傷許之小，力不能救，思歸唁其兄，又義不得，故賦是詩也。」</p>
<h3>載馳</h3>
<p>載馳載驅，歸唁衞侯，驅馬悠悠，言至于漕，大夫跋涉，我心則憂。</p>
<p>既不我嘉，不能旋反，視爾不臧，我思不遠。</p>
<p>既不我嘉，不能旋濟，視爾不臧，我思不閟。</p>
<p>陟彼阿丘，言采其蝱，女子善懷，亦各有行，許人尤之，衆穉且狂。</p>
<p>我行其野，芃芃其麥，控于大邦，誰因誰極，大夫君子，無我有尤，百爾所思，不如我所之。</p>
<p>《載馳》五章：一章六句，二章四句，一章六句，一章八句。</p>
