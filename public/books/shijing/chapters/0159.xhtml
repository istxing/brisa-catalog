<h2>九罭</h2>
<h3>國風‧豳‧九罭</h3>
<p>毛詩序：「《九罭》，美周公也。周大夫刺朝廷之不知也。」</p>
<h3>九罭</h3>
<p>九罭之魚，鱒魴。我覯之子，袞衣繡裳。</p>
<p>鴻飛遵渚，公歸無所。於女信處。</p>
<p>鴻飛遵陸，公歸不復。於女信宿。</p>
<p>是以有袞衣兮，無以我公歸兮，無使我心悲兮。</p>
<p>《九罭》，四章：一章四句；三章，章三句。</p>
