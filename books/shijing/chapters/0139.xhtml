<h2>東門之池</h2>
<h3>國風‧陳‧東門之池</h3>
<p>毛詩序：「《東門之池》，刺時也。疾其君子淫昏，而思賢女以配君子也。」</p>
<h3>東門之池</h3>
<p>東門之池，可以漚麻。彼美淑姬，可與晤歌。</p>
<p>東門之池，可以漚紵。彼美淑姬，可與晤語。</p>
<p>東門之池，可以漚菅。彼美淑姬，可與晤言。</p>
<p>《東門之池》，三章，章四句。</p>
