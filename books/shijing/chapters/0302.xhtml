<h2>般</h2>
<h3>周頌‧閔予小子之什‧般</h3>
<p>毛詩序：「《般》，巡守而祀四嶽河海也。」</p>
<h3>般</h3>
<p>於皇時周，陟其高山。嶞山喬嶽，允猶翕河。</p>
<p>敷天之下，裒時之對，時周之命。</p>
<p>《般》，一章，七句。</p>
