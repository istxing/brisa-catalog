<h2>角弓</h2>
<h3>小雅‧魚藻之什‧角弓</h3>
<p>毛詩序：「《角弓》，父兄刺幽王也。不親九族而好讒佞，骨肉相怨，故作是詩也。」</p>
<h3>角弓</h3>
<p>騂騂角弓，翩其反矣。兄弟昏姻，無胥遠矣。</p>
<p>爾之遠矣，民胥然矣。爾之教矣，民胥傚矣。</p>
<p>此令兄弟，綽綽有裕。不令兄弟，交相為瘉。</p>
<p>民之無良，相怨一方。受爵不讓，至于己斯亡。</p>
<p>老馬反為駒，不顧其後。如食宜饇，如酌孔取。</p>
<p>毋教猱升木，如塗塗附。君子有徽猷，小人與屬。</p>
<p>雨雪瀌瀌，見晛曰消。莫肯下遺，式居婁驕。</p>
<p>雨雪浮浮，見晛曰流。如蠻如髦，我是用憂。</p>
<p>《角弓》，八章，章四句。</p>
