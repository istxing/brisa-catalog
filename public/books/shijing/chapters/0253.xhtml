<h2>既醉</h2>
<h3>大雅‧生民之什‧既醉</h3>
<p>毛詩序：「《既醉》，大平也。醉酒飽德，人有士君子之行焉。」</p>
<h3>既醉</h3>
<p>既醉以酒，既飽以德。君子萬年，介爾景福。</p>
<p>既醉以酒，爾殽既將。君子萬年，介爾昭明。</p>
<p>昭明有融，高朗令終。令終有俶，公尸嘉告。</p>
<p>其告維何？籩豆靜嘉。朋友攸攝，攝以威儀。</p>
<p>威儀孔時，君子有孝子。孝子不匱，永錫爾類。</p>
<p>其類維何？室家之壼。君子萬年，永錫祚胤。</p>
<p>其胤維何？天被爾祿。君子萬年，景命有僕。</p>
<p>其僕維何？釐爾女士。釐爾女士，從以孫子。</p>
<p>《既醉》，八章，章四句。</p>
