<h2>祈父</h2>
<h3>小雅‧鴻鴈之什‧祈父</h3>
<p>毛詩序：「《祈父》，刺宣王也。」</p>
<h3>祈父</h3>
<p>祈父！予王之爪牙，胡轉予于恤？靡所止居。</p>
<p>祈父！予王之爪士，胡轉予于恤？靡所厎止。</p>
<p>祈父！亶不聦，胡轉予于恤？有母之尸饔。</p>
<p>《祈父》，三章，章四句。</p>
