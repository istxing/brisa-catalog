<h2>墓門</h2>
<h3>國風‧陳‧墓門</h3>
<p>毛詩序：『《墓門》，刺陳佗也。陳佗無良師傅，以至於不義，惡加於萬民焉。』</p>
<h3>墓門</h3>
<p>墓門有棘，斧以斯之。夫也不良，國人知之。知而不已，誰昔然矣。</p>
<p>墓門有梅，有鴞萃止。夫也不良，歌以誶之。訊予不顧，顛倒思予。</p>
<p>《墓門》，二章，章六句。</p>
