<h2>庭燎</h2>
<h3>小雅‧鴻鴈之什‧庭燎</h3>
<p>毛詩序：「《庭燎》，美宣王也，因以箴之。」</p>
<h3>庭燎</h3>
<p>夜如何其？夜未央。庭燎之光，君子至止，鸞聲將將。</p>
<p>夜如何其？夜未艾。庭燎晣晣，君子至止，鸞聲噦噦。</p>
<p>夜如何其？夜鄉晨。庭燎有煇，君子至止，言觀其旂。</p>
<p>《庭燎》，三章，章五句。</p>
