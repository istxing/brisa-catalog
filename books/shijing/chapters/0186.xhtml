<h2>吉日</h2>
<h3>小雅‧南有嘉魚之什‧吉日</h3>
<p>毛詩序：「《吉日》，美宣王田也。能慎微接下，無不自盡，以奉其上焉。」</p>
<h3>吉日</h3>
<p>吉日維戊，既伯既禱。田車既好，四牡孔阜。升彼大阜，從其羣醜。</p>
<p>吉日庚午，既差我馬。獸之所同，麀鹿麌麌。漆沮之從，天子之所。</p>
<p>瞻彼中原，其祁孔有。儦儦俟俟，或羣或友。悉率左右，以燕天子。</p>
<p>既張我弓，既挾我矢。發彼小豝，殪此大兕。以御賓客，且以酌醴。</p>
<p>《吉日》，四章，章六句。</p>
