<h2>白華</h2>
<h3>小雅‧魚藻之什‧白華</h3>
<p>毛詩序：「《白華》，周人刺幽后也。幽王取申女以為后，又得襃姒而黜申后，故下國化之，以妾為妻，以孽代宗。而王弗能治。周人為之作是詩也。」</p>
<h3>白華</h3>
<p>白華菅兮，白茅束兮。之子之遠，俾我獨兮。</p>
<p>英英白雲，露彼菅茅。天步艱難，之子不猶。</p>
<p>滮池北流，浸彼稻田。嘯歌傷懷，念彼碩人。</p>
<p>樵彼桑薪，卬烘于煁。維彼碩人，實勞我心。</p>
<p>鼓鍾于宮，聲聞于外。念子懆懆，視我邁邁。</p>
<p>有鶖在梁，有鶴在林。維彼碩人，實勞我心。</p>
<p>鴛鴦在梁，戢其左翼。之子無良，二三其德。</p>
<p>有扁斯石，履之卑兮。之子之遠，俾我疧兮。</p>
<p>《白華》，八章，章四句。</p>
