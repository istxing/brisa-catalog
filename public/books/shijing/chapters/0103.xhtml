<h2>盧令</h2>
<h3>國風‧齊‧盧令</h3>
<p>毛詩序：「《盧令》，刺荒也。襄公好田獵，畢弋，而不脩民事。百姓苦之，故陳古以風焉。」</p>
<h3>盧令</h3>
<p>盧令令，其人美且仁。</p>
<p>盧重環，其人美且鬈。</p>
<p>盧重鋂，其人美且偲。</p>
<p>《盧令》，三章，章二句。</p>
