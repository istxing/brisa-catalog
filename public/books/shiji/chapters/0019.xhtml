<h2>卷十九</h2>
<p>太史公讀列封至便侯，曰：有以也夫！長沙王者，著令甲，稱其忠焉。昔高祖定天下，功臣非同姓疆土而王者八國。至孝惠時，唯獨長江全，禪五世，禪五世，以無嗣絕，意無過，爲藩守職，信矣。故其澤流枝庶，毋功而侯者數人。及孝惠訖孝景間五十載，追修高祖時遣功臣，及從代來，吳楚之勞，諸侯子弟若肺腑，外國歸義，封者九十有餘。咸表始終，當世仁義成功之著者也。</p>
<h3>孝惠時</h3>
<p>右孝惠時三。</p>
<h3>高后時</h3>
<p>右高后時三十一。</p>
<h3>孝文時</h3>
<p>右孝文時二十九。</p>
<h3>孝景時</h3>
<p>右孝景時三十。</p>
