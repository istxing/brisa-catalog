<h2>南有嘉魚</h2>
<h3>小雅‧南有嘉魚之什‧南有嘉魚</h3>
<p>毛詩序：「《南有嘉魚》，樂與賢也。太平君子至誠，樂與賢者共之也。」</p>
<h3>南有嘉魚</h3>
<p>南有嘉魚，烝然罩罩。君子有酒，嘉賓式燕以樂。</p>
<p>南有嘉魚，烝然汕汕。君子有酒，嘉賓式燕以衎。</p>
<p>南有樛木，甘瓠纍之。君子有酒，嘉賓式燕綏之。</p>
<p>翩翩者鵻，烝然來思。君子有酒，嘉賓式燕又思。</p>
<p>《南有嘉魚》，四章，章四句。</p>
