<h2>杕杜</h2>
<h3>國風‧唐‧杕杜</h3>
<p>毛詩序：「《杕杜》，刺時也。君不能親其宗族，骨肉離散，獨居而無兄弟，將為沃所并爾。」</p>
<h3>杕杜</h3>
<p>有杕之杜，其葉湑湑。獨行踽踽，豈無他人？不如我同父，嗟行之人，胡不比焉？人無兄弟，胡不佽焉？</p>
<p>有杕之杜，其葉菁菁。獨行睘睘，豈無他人？不如我同姓，嗟行之人，胡不比焉？人無兄弟，胡不佽焉？</p>
<p>《杕杜》，二章，章九句。</p>
