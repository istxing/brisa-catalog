<h2>魚藻</h2>
<h3>小雅‧魚藻之什‧魚藻</h3>
<p>毛詩序：「《魚藻》，刺幽王也。言萬物失其性，王居鎬京，將不能以自樂，故君子思古之武王焉。」</p>
<h3>魚藻</h3>
<p>魚在在藻，有頒其首。王在在鎬，豈樂飲酒。</p>
<p>魚在在藻，有莘其尾。王在在鎬，飲酒樂豈。</p>
<p>魚在在藻，依于其蒲。王在在鎬，有那其居。</p>
<p>《魚藻》，三章，章四句。</p>
