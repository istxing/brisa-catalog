<h2>綠衣</h2>
<p>毛詩序：「《綠衣》，衞莊姜傷己也。妾上僭，夫人失位而作是詩也。」</p>
<h3>綠衣</h3>
<p>綠兮衣兮，綠衣黃裏，心之憂矣，曷維其已。</p>
<p>綠兮衣兮，綠衣黃裳，心之憂矣，曷維其亡。</p>
<p>綠兮絲兮，女所治兮，我思古人，俾無訧兮。</p>
<p>絺兮綌兮，淒其以風，我思古人，實獲我心。</p>
<p>《綠衣》，四章，章四句。</p>
