<h2>終南</h2>
<h3>國風‧秦‧終南</h3>
<p>毛詩序：「《終南》，戒襄公也。能取周地，始為諸侯受顯服，大夫美之，故作是詩以戒勸之。」</p>
<h3>終南</h3>
<p>終南何有，有條有梅。君子至止，錦衣狐裘。顏如渥丹，其君也哉。</p>
<p>終南何有，有紀有堂。君子至止，黻衣繡裳。佩玉將將，壽考不亡。</p>
<p>《終南》，二章，章六句。</p>
