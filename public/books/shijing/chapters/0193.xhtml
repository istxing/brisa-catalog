<h2>黃鳥</h2>
<h3>小雅‧鴻鴈之什‧黃鳥</h3>
<p>毛詩序：「《黃鳥》，刺宣王也。」</p>
<h3>黃鳥</h3>
<p>黃鳥黃鳥，無集于榖，無啄我粟。</p>
<p>此邦之人，不我肯榖。言旋言歸，復我邦族。</p>
<p>黃鳥黃鳥，無集于桑，無啄我粱。</p>
<p>此邦之人，不可與明。言旋言歸，復我諸兄。</p>
<p>黃鳥黃鳥，無集于栩，無啄我黍。</p>
<p>此邦之人，不可與處。言旋言歸，復我諸父。</p>
<p>《黃鳥》，三章，章七句。</p>
