<h2>有駜</h2>
<h3>魯頌‧駉之什‧有駜</h3>
<p>毛詩序：「《有駜》，頌僖公君臣之有道也。」</p>
<h3>有駜</h3>
<p>有駜有駜，駜彼乘黃。夙夜在公，在公明明。<br/>振振鷺，鷺于下。鼓咽咽，醉言舞。于胥樂兮。<br/>有駜有駜，駜彼乘牡。夙夜在公，在公飲酒。<br/>振振鷺，鷺于飛。鼓咽咽，醉言歸。于胥樂兮。<br/>有駜有駜，駜彼乘駽。夙夜在公，在公載燕。<br/>自今以始，歲其有。君子有穀，詒孫子。于胥樂兮。</p>
<p>《有駜》，三章，章九句。</p>
