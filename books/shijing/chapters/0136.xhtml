<h2>宛丘</h2>
<h3>國風‧陳‧宛丘</h3>
<p>毛詩序：「《宛丘》，刺幽公也。淫荒昏亂，游蕩無度焉。」</p>
<h3>宛丘</h3>
<p>子之湯兮，宛丘之上兮，洵有情兮，而無望兮。</p>
<p>坎其擊鼓，宛丘之下，無冬無夏，值其鷺羽。</p>
<p>坎其擊缶，宛丘之道，無冬無夏，值其鷺翿。</p>
<p>《宛丘》，三章，章四句。</p>
