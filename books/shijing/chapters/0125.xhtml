<h2>采苓</h2>
<h3>國風‧唐‧采苓</h3>
<p>毛詩序：「《采苓》，刺晉獻公也。獻公好聽讒焉。」</p>
<h3>采苓</h3>
<p>采苓采苓，首陽之巔。人之為言，苟亦無信。舍旃舍旃，苟亦無然。人之為言，胡得焉！</p>
<p>采苦采苦，首陽之下。人之為言，苟亦無與。舍旃舍旃，苟亦無然。人之為言，胡得焉！</p>
<p>采葑采葑，首陽之東。人之為言，苟亦無從。舍旃舍旃，苟亦無然。人之為言，胡得焉！</p>
<p>《采苓》，三章，章八句。</p>
