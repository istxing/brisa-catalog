<h2>敬之</h2>
<h3>周頌‧閔予小子之什‧敬之</h3>
<p>毛詩序：「《敬之》，羣臣進戒嗣王也。」</p>
<h3>敬之</h3>
<p>敬之敬之，天維顯思。</p>
<p>命不易哉！無曰高高在上。</p>
<p>陟降厥士，日監在茲。</p>
<p>維予小子，不聦敬止？</p>
<p>日就月將，學有緝熙于光明。</p>
<p>佛時仔肩，示我顯德行。</p>
<p>《敬之》，一章，十二句。</p>
