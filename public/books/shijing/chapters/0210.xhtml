<h2>四月</h2>
<h3>小雅‧谷風之什‧四月</h3>
<p>毛詩序：「《四月》，大夫刺幽王也。在位貪殘，下國構禍，怨亂並興焉。」</p>
<h3>四月</h3>
<p>四月維夏，六月徂暑。先祖匪人？胡寧忍予？</p>
<p>秋日淒淒，百卉具腓。亂離瘼矣，爰其適歸？</p>
<p>冬日烈烈，飄風發發。民莫不穀，我獨何害？</p>
<p>山有嘉卉，侯栗侯梅。廢為殘賊，莫知其尤。</p>
<p>相彼泉水，載清載濁。我日構禍，曷云能穀？</p>
<p>滔滔江漢，南國之紀。盡瘁以仕，寧莫我有。</p>
<p>匪鶉匪鳶，翰飛戾天。匪鱣匪鮪，濳逃于淵。</p>
<p>山有蕨薇，隰有杞桋。君子作歌，維以告哀。</p>
<p>《四月》，八章，章四句。</p>
