<h2>玄鳥</h2>
<h3>商頌‧玄鳥</h3>
<p>毛詩序：「《玄鳥》，祀高宗也。」</p>
<h3>玄鳥</h3>
<p>天命玄鳥，降而生商。<br/>宅殷土芒芒。<br/>古帝命武湯，正域彼四方。<br/>方命厥后，奄有九有。<br/>商之先后，受命不殆。<br/>在武丁孫子。<br/>武丁孫子，武王靡不勝。<br/>龍旂十乘，大糦是承。<br/>邦畿千里，維民所止。<br/>肇域彼四海。<br/>四海來假，來假祁祁。<br/>景員維河。<br/>殷受命咸宜，百祿是何。</p>
<p>《玄鳥》，一章，二十二句。</p>
