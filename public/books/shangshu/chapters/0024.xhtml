<h2>傅說之命上</h2>
<p>惟殷王賜說於天，庸為失仲使人。王命厥百工向，以貨徇求說於邑人。惟弼人得說于傅巖，厥俾繃弓，引關辟矢。說方築城，縢降庸力，厥說之狀，腕肩如椎。王迺訊說曰：「帝抑尔以畀余，抑非？」說迺曰：「惟帝以余畀尔，尔左執朕袂，尔右稽首。」王曰：「亶然。天迺命說伐失仲。」失仲是生子，生二牡豕。失仲卜曰：「我其殺之」，「我其已，勿殺」。勿殺是吉。失仲違卜，乃殺一豕。說于圍伐失仲，一豕乃旋保以逝，迺踐，邑人皆從，一豕隨仲之自行，是為赦俘之戎。其惟說邑，在北海之州，是惟圜土。說來，自從事于殷，王用命說為公。</p>
