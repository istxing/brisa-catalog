<h2>剝</h2>
<p>周易　第二十三卦</p>
<p>剝</p>
<p>坤下艮上</p>
<p>易經：</p>
<p>剝：不利。有攸往。</p>
<p>初六：剝牀以足，蔑貞凶。</p>
<p>六二：剝牀以辨，蔑貞凶。</p>
<p>六三：剝之，无咎。</p>
<p>六四：剝牀以膚，凶。</p>
<p>六五：貫魚，以宮人寵，无不利。</p>
<p>上九：碩果不食，君子德車，小人剝廬。</p>
<p>彖曰：</p>
<p>剝，剝也，柔變剛也。不利有攸往，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。</p>
<p>象曰：</p>
<p>山附地上，剝；上以厚下，安宅。</p>
<p>剝牀以足，以滅下也。</p>
<p>剝牀以辨，未有與也。</p>
<p>剝之无咎，失上下也。</p>
<p>剝牀以膚，切近災也。</p>
<p>以宮人寵，終无尤也。</p>
<p>君子得輿，民所載也。小人剝廬，終不可用也。</p>
