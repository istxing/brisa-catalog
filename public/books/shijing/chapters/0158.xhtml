<h2>伐柯</h2>
<h3>國風‧豳‧伐柯</h3>
<p>毛詩序：「《伐柯》，美周公也。周大夫刺朝廷之不知也。」</p>
<h3>伐柯</h3>
<p>伐柯如何？匪斧不克。取妻如何？匪媒不得。</p>
<p>伐柯伐柯，其則不遠。我覯之子？籩豆有踐。</p>
<p>《伐柯》，二章，章四句。</p>
