<h2>鴇羽</h2>
<p>毛詩序：「《鴇羽》，刺時也。昭公之後，大亂五世，君子下從征役，不得養其父母，而作是詩也。」</p>
<h3>鴇羽</h3>
<p>肅肅鴇羽，集于苞栩。王事靡盬，不能蓺稷黍。父母何怙？悠悠蒼天，曷其有所。</p>
<p>肅肅鴇翼，集于苞棘。王事靡盬，不能蓺黍稷。父母何食？悠悠蒼天，曷其有極。</p>
<p>肅肅鴇行，集于苞桑。王事靡盬，不能蓺稻粱。父母何嘗？悠悠蒼天，曷其有常。</p>
<p>《鴇羽》，三章，章七句。</p>
