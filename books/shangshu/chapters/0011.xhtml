<h2>湯誓</h2>
<p>王曰：「格爾眾庶，悉聽朕言。非台（以）小子，敢行稱亂；有夏多罪，天命殛之。今爾有眾，汝曰：『我后不恤我眾，舍我穡事而割正〈夏〉{夏}。』予惟聞汝眾言；夏氏有罪，予畏上帝，不敢不正（征）。今汝其曰：『夏罪其如台（何）？』夏王率遏眾力，率割夏邑，有眾率怠弗協。曰：『時日曷喪？予及汝皆亡！』夏德若兹，今朕必往。爾尚輔予一人，致天之罰，予其大賚汝。爾無不信，朕不食言。爾不從誓言，予則孥戮汝，罔有攸赦。」</p>
