<h2>駟驖</h2>
<h3>國風‧秦‧駟驖</h3>
<p>毛詩序：「《駟驖》，美襄公也。始命有田狩之事，園囿之樂焉。」</p>
<h3>駟驖</h3>
<p>駟驖孔阜，六轡在手。公之媚子，從公于狩。</p>
<p>奉時辰牡，辰牡孔碩。公曰左之，舍拔則獲。</p>
<p>遊于北園，四馬既閑。輶車鸞鑣，載獫歇驕。</p>
<p>《駟驖》，三章，章四句。</p>
