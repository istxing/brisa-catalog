<h2>東門之楊</h2>
<h3>國風‧陳‧東門之楊</h3>
<p>毛詩序：「《東門之楊》，刺時也。昏姻失時，男女多違，親迎女猶有不至者也。」</p>
<h3>東門之楊</h3>
<p>東門之楊，其葉牂牂。昏以為期，明星煌煌。</p>
<p>東門之楊，其葉肺肺。昏以為期，明星晢晢。</p>
<p>《東門之楊》，三章，章四句。</p>
