<h2>還</h2>
<p>毛詩序：「《還》，刺荒也。哀公好田獵，從禽獸而無厭，國人化之，遂成風俗，習於田獵，謂之賢，閑於馳逐，謂之好焉。」</p>
<h3>還</h3>
<p>子之還兮，遭我乎峱之閒兮。並驅從兩肩兮，揖我謂我儇兮。</p>
<p>子之茂兮，遭我乎峱之道兮。並驅從兩牡兮，揖我謂我好兮。</p>
<p>子之昌兮，遭我乎峱之陽兮。並驅從兩狼兮，揖我謂我臧兮。</p>
<p>《還》，三章，章四句。</p>
