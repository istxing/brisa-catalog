<h2>執競</h2>
<h3>周頌‧清廟之什‧執競</h3>
<p>毛詩序：「《執競》，祀武王也。」</p>
<h3>執競</h3>
<p>執競武王，無競維烈，不顯成康，上帝是皇。自彼成康，奄有四方。</p>
<p>斤斤其明！鐘鼓喤喤，磬筦將將，降福穰穰，降福簡簡，威儀反反。</p>
<p>既醉既飽，福祿來反。</p>
<p>《執競》，一章，十四句。</p>
