<h2>皇皇者華</h2>
<h3>小雅‧鹿鳴之什‧皇皇者華</h3>
<p>毛詩序：「《皇皇者華》，君遣使臣也。送之以禮樂，言遠而有光華也。」</p>
<h3>皇皇者華</h3>
<p>皇皇者華，于彼原隰。駪駪征夫，每懷靡及。<br/>我馬維駒，六轡如濡。載馳載驅，周爰咨諏。<br/>我馬維騏，六轡如絲。載馳載驅，周爰咨謀。<br/>我馬維駱，六轡沃若。載馳載驅，周爰咨度。<br/>我馬維駰，六轡既均。載馳載驅，周爰咨詢。</p>
<p>《皇皇者華》，五章，章四句。</p>
