<h2>月出</h2>
<h3>國風‧陳‧月出</h3>
<p>毛詩序：「《月出》，刺好色也。在位不好德而說美色焉。」</p>
<h3>月出</h3>
<p>月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。</p>
<p>月出皓兮，佼人懰兮，舒懮受兮，勞心慅兮。</p>
<p>月出照兮，佼人燎兮，舒夭紹兮，勞心慘兮。</p>
<p>《月出》，三章，章四句。</p>
