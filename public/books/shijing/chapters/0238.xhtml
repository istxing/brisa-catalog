<h2>漸漸之石</h2>
<h3>小雅‧魚藻之什‧漸漸之石</h3>
<p>毛詩序：「《漸漸之石》，下國刺幽王也。戎狄叛之，荊舒不至，乃命將率東征，役久病於外，故作是詩也。」</p>
<h3>漸漸之石</h3>
<p>漸漸之石，維其高矣。山川悠遠，維其勞矣。武人東征，不皇朝矣。</p>
<p>漸漸之石，維其卒矣。山川悠遠，曷其沒矣。武人東征，不皇出矣。</p>
<p>有豕白蹢，烝涉波矣。月離于畢，俾滂沱矣。武人東征，不皇他矣。</p>
<p>《漸漸之石》，三章，章六句。</p>
