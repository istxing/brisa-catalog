<h2>瓠葉</h2>
<h3>小雅‧魚藻之什‧瓠葉</h3>
<p>毛詩序：「瓠葉，大夫刺幽王也。上棄禮而不能行，雖有牲牢饔餼，不肯用也。故思古之人，不以微薄廢禮焉。」</p>
<h3>瓠葉</h3>
<p>幡幡瓠葉，采之亨之。君子有酒，酌言嘗之。</p>
<p>有兔斯首，炮之燔之。君子有酒，酌言獻之。</p>
<p>有兔斯首，燔之炙之。君子有酒，酌言酢之。</p>
<p>有兔斯首，燔之炮之。君子有酒，酌言醻之。</p>
<p>《瓠葉》，四章，章四句。</p>
