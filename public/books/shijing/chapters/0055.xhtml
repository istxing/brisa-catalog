<h2>淇奧</h2>
<h3>國風‧衞‧淇奧</h3>
<p>毛詩序：「《淇奧》，美武公之德也。有文章，又能聽其規諫，以禮自防，故能入相于周，美而作是詩也。」</p>
<h3>淇奧</h3>
<p>瞻彼淇奧，綠竹猗猗，有匪君子，如切如瑳，如琢如磨，瑟兮僩兮，赫兮咺兮，有匪君子，終不可諼兮。</p>
<p>瞻彼淇奧，綠竹青青，有匪君子，充耳琇瑩，會弁如星，瑟兮僩兮，赫兮咺兮，有匪君子，終不可諼兮。</p>
<p>瞻彼淇奧，綠竹如簀，有匪君子，如金如錫，如圭如璧，寬兮綽兮，猗重較兮，善戲謔兮，不為虐兮。</p>
<p>《淇奧》，三章，章九句。</p>
