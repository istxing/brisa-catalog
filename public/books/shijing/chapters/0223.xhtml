<h2>頍弁</h2>
<h3>小雅‧甫田之什‧頍弁</h3>
<p>毛詩序：「《頍弁》，諸公刺幽王也。暴戾無親，不能宴樂同姓，親睦九族，孤危將亡，故作是詩也。」</p>
<h3>頍弁</h3>
<p>有頍者弁，實維伊何？爾酒既旨，爾殽既嘉。</p>
<p>豈伊異人？兄弟匪他。蔦與女蘿，施于松柏。</p>
<p>未見君子，憂心弈弈；既見君子，庶幾說懌。</p>
<p>有頍者弁，實維何期？爾酒既旨，爾殽既時。</p>
<p>豈伊異人？兄弟具來。蔦與女蘿，施于松上。</p>
<p>未見君子，憂心怲怲；既見君子，庶幾有臧。</p>
<p>有頍者弁，實維在首？爾酒既旨，爾殽既阜。</p>
<p>豈伊異人？兄弟甥舅。如彼雨雪，先集維霰。</p>
<p>死喪無日，無幾相見，樂酒今夕，君子維宴。</p>
<p>《頍弁》，三章，章十二句。</p>
