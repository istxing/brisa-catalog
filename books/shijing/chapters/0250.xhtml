<h2>文王有聲</h2>
<h3>大雅‧文王之什‧文王有聲</h3>
<p>毛詩序：「《文王有聲》，繼伐也。武王能廣文王之聲，卒其伐功也。」</p>
<h3>文王有聲</h3>
<p>文王有聲，遹駿有聲。遹求遹寧，遹觀厥成。文王烝哉。</p>
<p>文王受命，有此武功。既伐于崇，作邑于豐。文王烝哉。</p>
<p>築城伊淢，作豐伊匹。匪棘其欲，遹追來孝。王后烝哉。</p>
<p>王公伊濯，維豐之垣。四方攸同，王后維翰。王后烝哉。</p>
<p>豐水東注，維禹之績。四方攸同，皇王維辟。皇王烝哉。</p>
<p>鎬京辟廱，自西自東。自南自北，無思不服。皇王烝哉。</p>
<p>考卜維王，宅是鎬京。維龜正之，武王成之。武王烝哉。</p>
<p>豐水有芑，武王豈不仕。詒厥孫謀，以燕翼子。武王烝哉。</p>
<p>《文王有聲》，八章，章五句。</p>
