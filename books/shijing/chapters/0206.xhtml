<h2>巷伯</h2>
<h3>小雅‧節南山之什‧巷伯</h3>
<p>毛詩序：「《巷伯》，刺幽王也。寺人傷於讒，故作是詩也。」</p>
<h3>巷伯</h3>
<p>萋兮斐兮，成是貝錦。彼譖人者，亦已大甚。</p>
<p>哆兮侈兮，成是南箕。彼譖人者，誰適與謀？</p>
<p>緝緝翩翩，謀欲譖人。慎爾言也，謂爾不信。</p>
<p>捷捷幡幡，謀欲譖言。豈不爾受？既其女遷。</p>
<p>驕人好好，勞人草草。蒼天蒼天！視彼驕人，矜此勞人！</p>
<p>彼譖人者，誰適與謀？取彼譖人，投畀豺虎。</p>
<p>豺虎不食，投畀有北。有北不受，投畀有昊。</p>
<p>楊園之道，猗于畝丘。寺人孟子，作為此詩。</p>
<p>凡百君子，敬而聽之。</p>
<p>《巷伯》，七章：四章，章四句；一章，五句；一章，八句；一章，六句。</p>
