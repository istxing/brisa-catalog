<h2>風雨</h2>
<h3>國風‧鄭‧風雨</h3>
<p>毛詩序：「《風雨》，思君子也。亂世則思君子，不改其度焉。」</p>
<h3>風雨</h3>
<p>風雨淒淒，雞鳴喈喈。既見君子，云胡不夷。</p>
<p>風雨瀟瀟，雞鳴膠膠。既見君子，云胡不瘳。</p>
<p>風雨如晦，雞鳴不已。既見君子，云胡不喜。</p>
<p>《風雨》，三章，章四句。</p>
