<h2>小毖</h2>
<h3>周頌‧閔予小子之什‧小毖</h3>
<p>毛詩序：「《小毖》，嗣王求助也。」</p>
<h3>小毖</h3>
<p>予其懲，而毖後患。莫予荓蜂，自求辛螫。</p>
<p>肇允彼桃蟲，拚飛維鳥。未堪家多難，予又集于蓼。</p>
<p>《小毖》，一章，八句。</p>
