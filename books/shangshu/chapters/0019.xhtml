<h2>尹誥</h2>
<p>惟尹既及湯，咸有一德。尹念天之敗西邑夏。曰：“夏自絕其有民，亦惟厥眾，非民亡與守邑。厥辟作怨於民，民復之用離心。我剪滅夏，今後曷不監？”<br/>摯告湯曰：“我克協我友。今惟民遠邦歸志。”湯曰：“嗚呼！吾何作於民，俾我眾勿違朕言？”摯曰：“後其賚之，其有夏之金玉實邑，舍之。言。”乃致眾於亳中邑。</p>
