<h2>鴟鴞</h2>
<h3>國風‧豳‧鴟鴞</h3>
<p>毛詩序：「《鴟鴞》，周公救亂也。成王未知周公之志，公乃為詩以遺王，名之曰《鴟鴞》焉。」</p>
<h3>鴟鴞</h3>
<p>鴟鴞鴟鴞，既取我子，無毀我室！恩斯勤斯，鬻子之閔斯。</p>
<p>迨天之未陰雨，徹彼桑土。綢繆牖戶。今女下民，或敢侮予。</p>
<p>予手拮据，予所捋荼。予所蓄租，予口卒瘏。曰予未有室家。</p>
<p>予羽譙譙，予尾翛翛。予室翹翹，風雨所漂搖。予維音嘵嘵。</p>
<p>《鴟鴞》，四章，章五句。</p>
