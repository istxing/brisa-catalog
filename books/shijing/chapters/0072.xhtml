<h2>采葛</h2>
<h3>國風‧王‧采葛</h3>
<p>毛詩序：「《采葛》，懼讒也。」</p>
<h3>采葛</h3>
<p>彼采葛兮，一日不見，如三月兮。</p>
<p>彼采蕭兮，一日不見，如三秋兮。</p>
<p>彼采艾兮，一日不見，如三歲兮。</p>
<p>《采葛》，三章，章三句。</p>
