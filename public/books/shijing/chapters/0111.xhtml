<h2>十畝之間</h2>
<h3>國風‧魏‧十畝之間</h3>
<p>毛詩序：「《十畝之間》，刺時也。言其國削小，民無所居焉。」</p>
<h3>十畝之間</h3>
<p>十畝之間兮，桑者閑閑兮。行與子還兮。</p>
<p>十畝之外兮，桑者泄泄兮。行與子逝兮。</p>
<p>《十畝之間》，二章，章三句。</p>
<h3>註解</h3>
<p>泄泄（音亦，粵音跩，義魏切）：和樂的樣子</p>
