<h2>渭陽</h2>
<h3>國風‧秦‧渭陽</h3>
<p>毛詩序：「《渭陽》，康公念母也。康公之母，晉獻公之女，文公遭麗姬之難未反，而秦姬卒，穆公納文公，康公時為大子，贈送文公于渭之陽，念母之不見也，我見舅氏，如母存焉。及其即位，思而作是詩也。」</p>
<h3>渭陽</h3>
<p>我送舅氏，曰至渭陽。何以贈之，路車乘黃。</p>
<p>我送舅氏，悠悠我思。何以贈之，瓊瑰玉佩。</p>
<p>《渭陽》，二章，章四句。</p>
