<h2>河廣</h2>
<h3>國風‧衞‧河廣</h3>
<p>毛詩序：「《河廣》，宋襄公母歸于衞，思而不止，故作是詩也。」</p>
<h3>河廣</h3>
<p>誰謂河廣，一葦杭之，誰謂宋遠，跂予望之。</p>
<p>誰謂河廣，曾不容刀，誰謂宋遠，曾不崇朝。</p>
<p>《河廣》，二章，章四句。</p>
<h3>註解</h3>
<p>誰說黃河寬又廣？ 一只葦筏可渡航。</p>
<p>誰說宋國路遙遠？ 蹄起腳尖可眺望。</p>
<p>誰說黃河寬又廣？ 一條小船容不下。</p>
<p>誰說宋國路遙遠？ 一個上午可走到。</p>
