<h2>隰桑</h2>
<h3>小雅‧魚藻之什‧隰桑</h3>
<p>毛詩序：「《隰桑》，刺幽王也。小人在位，君子在野。思見君子，盡心以事之。」</p>
<h3>隰桑</h3>
<p>隰桑有阿，其葉有難。既見君子，其樂如何？</p>
<p>隰桑有阿，其葉有沃。既見君子，云何不樂？</p>
<p>隰桑有阿，其葉有幽。既見君子，德音孔膠。</p>
<p>心乎愛矣，遐不謂矣？中心藏之，何日忘之？</p>
<p>《隰桑》，五章，章四句。</p>
