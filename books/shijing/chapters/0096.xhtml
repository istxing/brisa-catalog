<h2>雞鳴</h2>
<h3>國風‧齊‧雞鳴</h3>
<p>毛詩序：「《雞鳴》，思賢妃也。哀公荒淫怠慢，故陳賢妃貞女，夙夜警戒相成之道焉。」</p>
<h3>雞鳴</h3>
<p>雞既鳴矣，朝既盈矣。匪雞則鳴，蒼蠅之聲。</p>
<p>東方明矣，朝既昌矣。匪東方則明，月出之光。</p>
<p>蟲飛薨薨，甘與子同夢。會且歸矣，無庶予子憎！</p>
<p>《雞鳴》，三章，章四句。</p>
