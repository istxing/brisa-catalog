<h2>君子于役</h2>
<h3>國風‧王‧君子于役</h3>
<p>毛詩序：「《君子于役》，刺平王也。君子行役無期度，大夫思其危難以風焉」</p>
<h3>君子于役</h3>
<p>君子于役，不知其期。曷至哉？雞棲于塒，日之夕矣，羊牛下來。君子于役，如之何勿思！</p>
<p>君子于役，不日不月。曷其有佸？雞棲于桀，日之夕矣，羊牛下括。君子于役，苟無飢渴。</p>
<p>《君子于役》，二章，章八句。</p>
