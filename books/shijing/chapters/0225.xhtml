<h2>青蠅</h2>
<h3>小雅‧甫田之什‧青蠅</h3>
<p>毛詩序：「《青蠅》，大夫刺幽王也。」</p>
<h3>青蠅</h3>
<p>營營青蠅，止於樊。豈弟君子，無信讒言。</p>
<p>營營青蠅，止于棘。讒人罔極，交亂四國。</p>
<p>營營青蠅，止于榛。讒人罔極，構我二人。</p>
<p>《青蠅》，三章，章四句。</p>
