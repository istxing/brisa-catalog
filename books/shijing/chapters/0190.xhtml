<h2>鶴鳴</h2>
<h3>小雅‧鴻鴈之什‧鶴鳴</h3>
<p>毛詩序：「《鶴鳴》，誨宣王也。」</p>
<h3>鶴鳴</h3>
<p>鶴鳴于九皐，聲聞于野。魚潛在淵，或在于渚。</p>
<p>樂彼之園，爰有樹檀，其下維蘀。它山之石，可以為錯。</p>
<p>鶴鳴于九皐，聲聞于天。魚在于渚，或潛在淵。</p>
<p>樂彼之園，爰有樹檀，其下維榖。它山之石，可以攻玉。</p>
<p>《鶴鳴》，二章，章九句。</p>
