<h2>碩鼠</h2>
<h3>國風‧魏‧碩鼠</h3>
<p>毛詩序：「《碩鼠》，刺重斂也。國人刺其君重斂蠶食於民，不脩其政，貪而畏人，若大鼠也。」</p>
<h3>碩鼠</h3>
<p>碩鼠碩鼠，無食我黍！三歲貫女，莫我肯顧。逝將去女，適彼樂土。樂土樂土，爰得我所。<br/>碩鼠碩鼠，無食我麥！三歲貫女，莫我肯德。逝將去女，適彼樂國。樂國樂國，爰得我直。<br/>碩鼠碩鼠，無食我苗！三歲貫女，莫我肯勞。逝將去女，適彼樂郊。樂郊樂郊，誰之永號。</p>
<p>《碩鼠》，三章，章八句。</p>
