<h2>蟋蟀</h2>
<h3>國風‧唐‧蟋蟀</h3>
<p>毛詩序：「《蟋蟀》，刺晉僖公也。儉不中禮，故作是詩以閔之。欲其及時以禮自虞樂也，此晉也而謂之唐，本其風俗，憂深思遠，儉而用禮，乃有堯之遺風焉。」</p>
<h3>蟋蟀</h3>
<p>蟋蟀在堂，歲聿其莫。今我不樂，日月其除。無已大康，職思其居。好樂無荒，良士瞿瞿。</p>
<p>蟋蟀在堂，歲聿其逝。今我不樂，日月其邁。無已大康，職思其外。好樂無荒，良士蹶蹶。</p>
<p>蟋蟀在堂，役車其休。今我不樂，日月其慆。無已大康，職思其憂。好樂無荒，良士休休。</p>
<p>《蟋蟀》，三章，章八句。</p>
