<h2>那</h2>
<h3>商頌‧那</h3>
<p>毛詩序：「《那》，祀成湯也。微子至于戴公，其間禮樂廢壞。有正考甫者，得《商頌》十二篇於周之大師。以《那》為首。」</p>
<h3>那</h3>
<p>猗與那與，置我鞉鼓。<br/>奏鼓簡簡，衎我烈祖。<br/>湯孫奏假，綏我思成。<br/>鞉鼓淵淵，嘒嘒管聲。<br/>既和且平，依我磬聲。<br/>於赫湯孫，穆穆厥聲。<br/>庸鼓有斁，萬舞有奕。<br/>我有嘉客，亦不夷懌。<br/>自古在昔，先民有作。<br/>溫恭朝夕，執事有恪。<br/>顧予烝嘗，湯孫之將。</p>
<p>《那》，一章，二十二句。</p>
<h3>註解</h3>
<p>猗與，歎美之言也。衎，樂也。綏，安也。斁，斁然，盛也。奕，次序也。</p>
