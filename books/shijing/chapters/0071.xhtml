<h2>葛藟</h2>
<h3>國風‧王‧葛藟</h3>
<p>毛詩序：「《葛藟》，王族刺平王也。周室道衰，棄其九族焉。」</p>
<h3>葛藟</h3>
<p>緜緜葛藟，在河之滸。終遠兄弟，謂他人父。謂他人父，亦莫我顧。</p>
<p>緜緜葛藟，在河之涘。終遠兄弟，謂他人母。謂他人母，亦莫我有。</p>
<p>緜緜葛藟，在河之漘。終遠兄弟，謂他人昆。謂他人昆，亦莫我聞。</p>
<p>《葛藟》，三章，章六句。</p>
