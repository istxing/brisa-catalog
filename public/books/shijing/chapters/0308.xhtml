<h2>烈祖</h2>
<h3>商頌‧烈祖</h3>
<p>毛詩序：「《烈祖》，祀中宗也。」</p>
<h3>烈祖</h3>
<p>嗟嗟烈祖，有秩斯祜。<br/>申錫無疆，及爾斯所。<br/>既載清酤。<br/>賚我思成，亦有和羹。<br/>既戒既平，鬷假無言。<br/>時靡有爭。<br/>綏我眉壽，黃耇無疆。<br/>約軝錯衡，八鸞鶬鶬。<br/>以假以享，我受命溥將。<br/>自天降康，豐年穰穰。<br/>來假來饗，降福無疆。<br/>顧予烝嘗，湯孫之將。</p>
<p>《烈祖》，一章，二十二句。</p>
