<h2>將仲子</h2>
<h3>國風‧鄭‧將仲子</h3>
<p>毛詩序：「《將仲子》，刺莊公也。不勝其母以害其弟，弟叔失道而公弗制，祭仲諫而公弗聽，小不忍以致大亂焉。」</p>
<h3>將仲子</h3>
<p>將仲子兮，無踰我里，無折我樹杞。豈敢愛之？畏我父母。仲可懷也，父母之言，亦可畏也。</p>
<p>將仲子兮，無踰我牆，無折我樹桑。豈敢愛之？畏我諸兄。仲可懷也，諸兄之言，亦可畏也。</p>
<p>將仲子兮，無踰我園，無折我樹檀。豈敢愛之？畏人之多言。仲可懷也，人之多言，亦可畏也。</p>
<p>《將仲子》，三章，章八句。</p>
