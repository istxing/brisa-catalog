<h2>鼓鍾</h2>
<h3>小雅‧谷風之什‧鼓鍾</h3>
<p>毛詩序：「《鼓鍾》，刺幽王也。」</p>
<h3>鼓鍾</h3>
<p>鼓鍾將將，淮水湯湯。憂心且傷。淑人君子，懷允不忘。</p>
<p>鼓鍾喈喈，淮水湝湝。憂心且悲。淑人君子，其德不回。</p>
<p>鼓鍾伐鼛，淮有三洲。憂心且妯。淑人君子，其德不猶。</p>
<p>鼓鍾欽欽，鼓瑟鼓琴。笙磬同音。以雅以南，以籥不僭。</p>
<p>《鼓鍾》，四章，章五句。</p>
