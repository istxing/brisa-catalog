<h2>野有蔓草</h2>
<h3>國風‧鄭‧野有蔓草</h3>
<p>毛詩序：「《野有蔓草》，思遇時也。君之澤不下流，民窮於兵革，男女失時，思不期而會焉。」</p>
<h3>野有蔓草</h3>
<p>野有蔓草，零露漙兮。有美一人，清揚婉兮。邂逅相遇，適我願兮。</p>
<p>野有蔓草，零露瀼瀼。有美一人，婉如清揚。邂逅相遇，與子皆臧。</p>
<p>《野有蔓草》，二章，章六句。</p>
