<h2>苕之華</h2>
<h3>小雅‧魚藻之什‧苕之華</h3>
<p>毛詩序：「《苕之華》，大夫閔時也。幽王之時，西戎東夷，交侵中國，師旅並起，因之以饑饉。君子閔周室之將亡，傷己逢之，故作是詩也。」</p>
<h3>苕之華</h3>
<p>苕之華，芸其黃矣。心之憂矣，維其傷矣。</p>
<p>苕之華，其葉青青。知我如此，不如無生。</p>
<p>牂羊墳首，三星在罶。人可以食，鮮可以飽。</p>
<p>《苕之華》，三章，章四句。</p>
