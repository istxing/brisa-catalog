<h2>菁菁者莪</h2>
<h3>小雅‧南有嘉魚之什‧菁菁者莪</h3>
<p>毛詩序：「《菁菁者莪》，樂育材也。君子能長育人材，則天下喜樂之矣。」</p>
<h3>菁菁者莪</h3>
<p>菁菁者莪，在彼中阿，既見君子，樂且有儀。</p>
<p>菁菁者莪，在彼中沚，既見君子，我心則喜。</p>
<p>菁菁者莪，在彼中陵，既見君子，錫我百朋。</p>
<p>汎汎楊舟，載沈載浮，既見君子，我心則休。</p>
<p>《菁菁者莪》，四章，章四句。</p>
