<h2>狼跋</h2>
<h3>國風‧豳‧狼跋</h3>
<p>毛詩序：「《狼跋》，美周公也。周公攝政，遠則四國流言，近則王不知周，大夫美其不失其聖也。」</p>
<h3>狼跋</h3>
<p>狼跋其胡，載疐其尾。公孫碩膚，赤舄几几。</p>
<p>狼疐其尾，載跋其胡。公孫碩膚，德音不瑕。</p>
<p>《狼跋》，二章，章四句。</p>
