<h2>女曰鷄鳴</h2>
<h3>國風‧鄭‧女曰鷄鳴</h3>
<p>毛詩序：「《女曰鷄鳴》，刺不說德也。陳古義以刺今，不說德而好色也。」</p>
<h3>女曰鷄鳴</h3>
<p>女曰鷄鳴，士曰昧旦。子興視夜，明星有爛。將翱將翔，弋鳧與鴈。</p>
<p>弋言加之，與子宜之。宜言飲酒，與子偕老。琴瑟在御，莫不靜好。</p>
<p>知子之來之，雜佩以贈之。知子之順之，雜佩以問之。知子之好之，雜佩以報之。</p>
<p>《女曰鷄鳴》，三章，章六句。</p>
