<h2>簡兮</h2>
<h3>國風‧邶‧簡兮</h3>
<p>毛詩序：「《簡兮》，刺不用賢也。衞之賢者仕於伶官，皆可以承事王者也。」</p>
<h3>簡兮</h3>
<p>簡兮簡兮，方將萬舞，日之方中，在前上處，碩人俁俁，公庭萬舞。</p>
<p>有力如虎，執轡如組，左手執籥，右手秉翟，赫如渥赭，公言錫爵。</p>
<p>山有榛，隰有苓，云誰之思，西方美人，彼美人兮，西方之人兮。</p>
<p>《簡兮》，三章，章六句。</p>
