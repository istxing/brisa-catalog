<h2>杕杜</h2>
<h3>小雅‧鹿鳴之什‧杕杜</h3>
<p>毛詩序：「《杕（dì）杜》，勞還役也。」</p>
<h3>杕杜</h3>
<p>有杕之杜，有睆其實。王事靡盬，繼嗣我日。日月陽止，女心傷止，征夫遑止。</p>
<p>有杕之杜，其葉萋萋。王事靡盬，我心傷悲。卉木萋止，女心悲止，征夫歸止。</p>
<p>陟彼北山，言采其杞。王事靡盬，憂我父母。檀車幝幝，四牡痯痯，征夫不遠。</p>
<p>匪載匪來，憂心孔疚。期逝不至，而多為恤。卜筮偕止，會言近止，征夫邇止。</p>
<p>《杕杜》，四章，章七句。</p>
