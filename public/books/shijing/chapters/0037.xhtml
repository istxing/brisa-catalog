<h2>旄丘</h2>
<h3>國風‧邶‧旄丘</h3>
<p>毛詩序：「《旄丘》，責衞伯也。狄人迫逐黎侯，黎侯寓于衞，衞不能脩方伯連率之職，黎之臣子以責於衞也。」</p>
<h3>旄丘</h3>
<p>旄丘之葛兮，何誕之節兮，叔兮伯兮，何多日也。</p>
<p>何其處也，必有與也，何其久也，必有以也。</p>
<p>狐裘蒙戎，匪車不東，叔兮伯兮，靡所與同。</p>
<p>瑣兮尾兮，流離之子，叔兮伯兮，褎如充耳。</p>
<p>《旄丘》，四章，章四句。</p>
