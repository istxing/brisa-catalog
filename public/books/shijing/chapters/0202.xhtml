<h2>小宛</h2>
<h3>小雅‧節南山之什‧小宛</h3>
<p>毛詩序：「《小宛》，大夫刺宣王也。」</p>
<h3>小宛</h3>
<p>宛彼鳴鳩，翰飛戾天。我心憂傷，念昔先人。明發不寐，有懷二人。</p>
<p>人之齊聖，飲酒溫克。彼昏不知，壹醉日富。各敬爾儀，天命不又。</p>
<p>中原有菽，庶民采之。螟蛉有子，蜾蠃負之。教誨爾子，式穀似之。</p>
<p>題彼脊令，載飛載鳴。我日斯邁，而月斯征。夙興夜寐，毋忝爾所生。</p>
<p>交交桑扈，率場啄粟。哀我填寡，宜岸宜獄。握粟出卜，自何能穀？</p>
<p>溫溫恭人，如集于木。惴惴小心，如臨于谷。戰戰兢兢，如履薄冰。</p>
<p>《小宛》，六章，章六句。</p>
