<h2>北門</h2>
<h3>國風‧邶‧北門</h3>
<p>毛詩序：「《北門》，刺仕不得志也。言衞之忠臣不得其志爾。」</p>
<h3>北門</h3>
<p>出自北門，憂心殷殷，終窶且貧，莫知我艱，已焉哉，天實為之，謂之何哉。</p>
<p>王事適我，政事一埤益我，我入自外，室人交徧讁我，已焉哉，天實為之，謂之何哉。</p>
<p>王事敦我，政事一埤遺我，我入自外，室人交徧摧我，已焉哉，天實為之，謂之何哉。</p>
<p>《北門》，三章，章七句。</p>
