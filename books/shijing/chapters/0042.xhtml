<h2>靜女</h2>
<h3>國風‧邶‧靜女</h3>
<p>毛詩序：「《靜女》，刺時也。衞君無道，夫人無德。」</p>
<h3>靜女</h3>
<p>靜女其姝，俟我於城隅，愛而不見，搔首踟躕。</p>
<p>靜女其孌，貽我彤管，彤管有煒，說懌女美。</p>
<p>自牧歸荑，洵美且異，匪女之為美，美人之貽。</p>
<p>《靜女》，三章，章四句。</p>
