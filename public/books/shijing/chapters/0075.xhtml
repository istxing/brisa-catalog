<h2>緇衣</h2>
<p>毛詩序：「《緇衣》，美武公也。父子並為周司徒，善於其職，國人宜之，故美其德，以明有國善善之功焉。」</p>
<h3>緇衣</h3>
<p>緇衣之宜兮，敝，予又改為兮。適子之館兮，還，予授子之粲兮。</p>
<p>緇衣之好兮，敝，予又改造兮。適子之館兮，還，予授子之粲兮。</p>
<p>緇衣之蓆兮，敝，予又改作兮。適子之館兮，還，予授子之粲兮。</p>
<p>《緇衣》，三章，章四句。</p>
